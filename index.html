<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ALGORITHM DEFENSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e17; --panel:#131829; --panel2:#0d121e; --line:#1e2740;
    --txt:#dbe4f4; --dim:#7d8aa3;
    --mono:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --disp:'Space Grotesk', system-ui, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:#05070c;color:var(--txt);
    font-family:var(--mono);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
  body{display:flex;justify-content:center}

  .app{position:relative;width:100%;max-width:470px;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;
    gap:6px;padding:6px 8px calc(8px + env(safe-area-inset-bottom));
    border-left:1px solid var(--line);border-right:1px solid var(--line)}

  /* 상단 HUD — 한 줄 */
  .hud{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;flex:0 0 auto}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 2px;text-align:center;overflow:hidden}
  .stat i{display:block;font-style:normal;color:var(--dim);font-size:7.5px;letter-spacing:.7px}
  .stat b{font-size:12.5px;line-height:1.25;white-space:nowrap}

  /* 보드 — 남는 공간 전부 */
  .board{flex:1 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  canvas{max-width:100%;max-height:100%;width:auto;height:auto;display:block;touch-action:none}


  #btn-resume{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:3;
    min-height:32px;padding:5px 14px;font-size:11px;background:#2a2340;border-color:#5b47a0;color:#d9c9ff}
  #btn-skip{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);z-index:3;
    min-height:34px;padding:6px 16px;font-size:11.5px}

  /* 선택 유닛 스트립 */
  .ustrip{flex:0 0 auto;display:flex;align-items:center;gap:7px;width:100%;text-align:left;
    min-height:38px;padding:5px 10px;font-family:var(--mono);background:var(--panel);
    border:1px solid var(--line);border-radius:8px;color:var(--txt);overflow:hidden}
  .ustrip b{font-size:11px;flex:0 0 auto}
  .ustrip em{font-style:normal;font-weight:700;font-size:12px;flex:0 0 auto}
  .ustrip span{font-size:10px;color:var(--dim);flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ustrip i{font-style:normal;font-size:9px;color:var(--dim);border:1px solid var(--line);
    border-radius:5px;padding:3px 6px;flex:0 0 auto}
  .ustrip .ph{color:var(--dim);font-size:10.5px}
  .ustrip{transition:border-color .25s ease, background .25s ease}
  .ustrip.has{border-color:#33406a}
  .ustrip.flash{border-color:#33406a;background:#182036}
  .ustrip.flash.hi{border-color:#5b6ea8}
  .ustrip .fm{font-size:11px;color:var(--txt);flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat{transition:background .15s,border-color .15s}
  .stat.hurt{background:#2c1a1e;border-color:#8a4046;animation:shake .35s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}
    50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}

  /* 하단 컨트롤 — 4열 2행 */
  .controls{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .controls .two{grid-column:span 2}
  button{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--txt);background:var(--panel);
    border:1px solid var(--line);border-radius:8px;min-height:42px;padding:5px 3px;cursor:pointer;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .16s ease, border-color .16s ease, opacity .16s ease;
    white-space:nowrap;text-overflow:ellipsis}
  button small{display:block;font-size:8.5px;font-weight:400;color:var(--dim);margin-top:1px}
  button:active:not(:disabled){transform:scale(.955)}
  button:disabled{opacity:.32;cursor:not-allowed}
  button:focus-visible{outline:2px solid #79c0ff;outline-offset:2px}
  .primary{background:#17233d;border-color:#31477a;color:#cfe3ff}
  .primary small{color:#8fb4e8}
  .go{background:#1b2c20;border-color:#3f6b45;color:#a9e5b3}
  .on{background:#2a2340;border-color:#5b47a0;color:#d9c9ff}
  .danger{background:#2c1a1e;border-color:#6b3a3f;color:#ffb3b3}
  .danger small{color:#c98d92}
  .full{width:100%;margin-top:10px}

  /* 바텀 시트 */
  #sidedock{display:contents}
  #scrim{position:fixed;inset:0;background:rgba(5,7,12,.65);opacity:0;pointer-events:none;
    transition:opacity .3s ease;z-index:14}
  #scrim.open{opacity:1;pointer-events:auto}
  #sheet{position:fixed;left:50%;transform:translate(-50%,102%);width:100%;max-width:470px;bottom:0;z-index:15;background:var(--panel);
    border-top:1px solid #2b3859;border-radius:14px 14px 0 0;
    transition:transform .38s cubic-bezier(.22,1,.36,1);
    display:flex;flex-direction:column;max-height:88%}
  #sheet.open{transform:translate(-50%,0)}
  .sh{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:11px 13px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .sh b{font-family:var(--disp);font-size:14px}
  .sh button{min-height:32px;padding:5px 12px;font-size:11px}
  #sheet-body{padding:12px 13px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}

  .empty{font-size:11.5px;line-height:1.75;color:var(--dim);margin:0}
  .u-head{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
  .u-name{font-family:var(--disp);font-size:19px;margin:0}
  .tag{font-size:9.5px;padding:2px 7px;border-radius:99px;border:1px solid currentColor;letter-spacing:.8px}
  .u-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0 0 10px}
  .u-stats div{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:5px 2px;text-align:center;font-size:8.5px;color:var(--dim)}
  .u-stats b{display:block;font-size:12px;color:var(--txt);margin-top:2px}
  .u-desc{font-size:11.5px;line-height:1.75;color:var(--dim);margin:0}
  .u-vfx{font-size:10.5px;color:var(--dim);margin:9px 0;line-height:1.6}
  .u-vfx b{color:var(--txt)}
  .u-code{font-size:11px;color:#7ee787;background:var(--panel2);border-left:2px solid #2c6b3a;
    padding:7px 9px;margin:0;border-radius:0 5px 5px 0;overflow-x:auto;white-space:nowrap}

  /* 빨간 알림 배지 */
  button{position:relative}
  .dot{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;
    background:#ff4d4d;color:#fff;border-radius:99px;font-size:9.5px;font-weight:700;font-style:normal;
    display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg);
    animation:none}
  .dot.pop{animation:dotIn .32s cubic-bezier(.34,1.56,.64,1) both}
  .dot.hide{display:none}
  @keyframes dotIn{from{transform:scale(0)}to{transform:scale(1)}}
  .seg button .dot{top:-6px;right:-6px;box-shadow:0 0 0 2px var(--panel)}
  /* 소환권 지갑 */
  /* 연구소 */
  .lab{display:flex;flex-direction:column;gap:7px}
  .lrow{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:9px;
    padding:9px 11px;background:var(--panel2)}
  .lrow .ll{flex:1;min-width:0}
  .ln{font-size:12.5px;font-weight:700}
  .ln span{font-size:9.5px;color:var(--dim);font-weight:400;margin-left:4px}
  .ld{font-size:10px;color:var(--dim);margin-top:3px;line-height:1.5}
  .lbar{height:3px;background:#0b0f1a;border-radius:2px;margin-top:6px;overflow:hidden}
  .lbar i{display:block;height:100%;transition:width .3s cubic-bezier(.22,1,.36,1)}
  .lrow button{min-height:36px;padding:6px 11px;font-size:11px;flex:0 0 auto}
  .labh{font-family:var(--disp);font-size:11px;color:var(--dim);letter-spacing:1px;
    margin:16px 0 7px;padding-top:12px;border-top:1px solid var(--line)}
  .seg button{position:relative}
  .segn{font-style:normal;font-size:10px;font-weight:700;color:var(--tc,var(--dim));
    margin-left:5px;padding:1px 5px;border-radius:99px;background:#0b0f1a}
  .wallet{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
  .tw{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;
    border:1px solid var(--line);border-radius:9px;background:var(--panel2);opacity:.45}
  .tw.has{opacity:1;border-color:#33406a}
  .tw i{width:16px;height:3px;border-radius:2px}
  .tw span{font-size:9px;color:var(--dim)}
  .tw b{font-size:16px;font-family:var(--disp)}
  .ab-rdy{margin-top:8px;font-size:10px;color:#ffd76e;text-align:center;
    border:1px solid #6b5a2a;border-radius:7px;padding:6px}
  .abil{border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin:9px 0 0;background:var(--panel2)}
  .abil.sk{border-left:2px solid #79c0ff}
  .abil.ult{border-left:2px solid #ffd76e}
  .ab-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .ab-h b{font-size:9.5px;letter-spacing:1px;color:var(--dim)}
  .ab-h span{font-size:12.5px;font-weight:700}
  .ab-h i{font-style:normal;font-size:9px;color:var(--dim);border:1px solid var(--line);
    border-radius:99px;padding:2px 7px;margin-left:auto}
  .abil p{font-size:10.5px;line-height:1.65;color:var(--dim);margin:5px 0 0}
  .ab-g{height:4px;background:#0b0f1a;border-radius:3px;margin:8px 0 3px;overflow:hidden}
  .ab-g div{height:100%;background:#ffd76e}
  .ab-n{font-size:9px;color:var(--dim);text-align:right}
  .abil .full{margin-top:8px;min-height:36px}
  .autobar{display:flex;justify-content:space-between;align-items:center;gap:10px;
    border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:2px}
  .autobar span{font-size:10.5px;color:var(--dim);line-height:1.55}
  .autobar button{min-height:32px;padding:5px 15px;font-size:11px;flex:0 0 auto}
  .recipe{border-top:1px solid var(--line);padding:9px 0;display:flex;align-items:center;gap:9px}
  .recipe .rl{flex:1;min-width:0}
  .rname{color:#ffd76e;font-weight:700;font-size:12.5px}
  .need{color:var(--dim);font-size:10.5px;margin-top:3px;line-height:1.6}
  .need .ok{color:#7ee787}
  .recipe button{min-height:34px;padding:6px 13px;font-size:11px;flex:0 0 auto}

  .gacha{display:flex;flex-direction:column;gap:7px}
  .grow{display:flex;align-items:center;gap:9px;border:1px solid var(--line);
    border-radius:9px;padding:9px 11px;background:var(--panel2)}
  .grow .gl{flex:1;min-width:0}
  .grow .gn{font-weight:700;font-size:13px}
  .grow .gd{font-size:10px;color:var(--dim);margin-top:3px;line-height:1.55}
  .grow button{min-height:36px;padding:6px 12px;font-size:11.5px;flex:0 0 auto}
  .pity{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:10px}
  .pity-t{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;color:var(--dim)}
  .pity-t b{font-size:14px;color:#ffd76e}
  .pity-bar{height:5px;background:#0a0e18;border-radius:99px;margin:7px 0 6px;overflow:hidden}
  .pity-bar i{display:block;height:100%;background:linear-gradient(90deg,#ffa657,#ffd76e);border-radius:99px;transition:width .2s}
  .pity-n{font-size:9.5px;color:#5f6b82;line-height:1.5}

  .seg{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);
    border-radius:9px;padding:3px;margin-bottom:11px}
  .seg button{flex:1;min-height:32px;font-size:11px;font-weight:400;background:transparent;
    border:0;color:var(--dim);border-radius:6px;padding:5px 3px}
  .seg button.sel{background:#222c47;color:var(--txt);font-weight:700}

  .bigcard{border:1px solid #31477a;background:#141c30;border-radius:10px;padding:12px}
  .bc-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .bc-h b{font-family:var(--disp);font-size:16px}
  .bc-h span{font-size:10px;color:var(--dim)}
  .bc-d{font-size:11px;color:var(--dim);line-height:1.7;margin:0 0 11px}
  .bc-d b{color:var(--txt)}
  .odds{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:11px;font-size:10px;color:var(--dim)}
  .odds div{display:flex;align-items:center;gap:5px}
  .odds i{width:7px;height:7px;border-radius:2px;display:block}

  .nsec{margin-bottom:11px}
  .nsec h5{margin:0 0 6px;font-size:10.5px;letter-spacing:1px}
  .ngrid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
  .nchip{text-align:left;min-height:44px;padding:6px 9px;font-size:11.5px;line-height:1.35}
  .nchip small{color:var(--dim);font-size:9px}
  .nchip.off{opacity:.4}
  .nchip.want{border-color:#8a6d2a;background:#241f10}
  .nchip.want b{color:#ffd76e}

  .recipe.can{background:#131f16;border-radius:8px;padding-left:8px;padding-right:8px;margin:2px -8px}
  .need .ready{color:#7ee787}
  .need .short{color:#c98d92}
  .warn{font-size:10.5px;color:#ffd76e;background:#241f10;border:1px solid #8a6d2a;
    border-radius:7px;padding:7px 9px;margin:11px 0 0;line-height:1.6}
  .draft{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:4px}
  .draft .dcard{animation:cardUp .42s cubic-bezier(.22,1,.36,1) both}
  .draft .dcard:nth-child(2){animation-delay:.07s}
  .draft .dcard:nth-child(3){animation-delay:.14s}
  @keyframes cardUp{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
  .dcard{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:104px;
    padding:10px 5px;border-color:var(--c);background:var(--panel2);white-space:normal}
  .dcard .dt{font-size:9px;letter-spacing:.6px}
  .dcard .ds{font-size:15px;line-height:1.2}
  .dcard .dn{font-size:12px;font-weight:700}
  .dcard .dd{font-size:8.5px;color:var(--dim);line-height:1.45;font-weight:400}
  .tkbar{background:#1b2c20;border:1px solid #3f6b45;color:#a9e5b3;border-radius:8px;
    padding:8px 10px;font-size:10.5px;line-height:1.6;margin-bottom:9px}
  .nchip.tk{border-color:#3f6b45}
  .nchip.tk small{color:#a9e5b3}
  .gnote{font-size:10.5px;color:var(--dim);line-height:1.7;margin:11px 0 0}

  .logbox{font-size:11px;line-height:1.8;color:var(--dim)}
  .logbox .hi{color:var(--txt)}
  .dex h4{margin:15px 0 4px;font-size:10.5px;letter-spacing:1.1px}
  .dex h4:first-child{margin-top:0}
  .row{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:11px;line-height:1.65}
  .row b{flex:0 0 76px}
  .row span{color:var(--dim)}
  .menu{display:flex;flex-direction:column;gap:7px}
  .menu button{min-height:50px;text-align:left;padding:8px 13px;font-size:12.5px}
  .menu button small{margin-top:3px}


  /* ── 메인화면 */
  #title{position:absolute;inset:0;z-index:20;background:linear-gradient(#0d1220,#070a12 60%);
    display:flex;flex-direction:column;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
  #title.hide{display:none}
  #title.out{animation:titleOut .42s cubic-bezier(.55,0,.85,.2) both}
  @keyframes titleOut{to{opacity:0;transform:scale(1.06);filter:blur(5px)}}
  .board.boot{animation:boardIn .62s cubic-bezier(.22,1,.36,1) both}
  @keyframes boardIn{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:none}}
  .hud.boot,.ustrip.boot,.controls.boot{animation:riseIn .55s cubic-bezier(.22,1,.36,1) both}
  .hud.boot{animation-delay:.10s} .ustrip.boot{animation-delay:.20s} .controls.boot{animation-delay:.26s}
  @keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  /* 부팅 문구 */
  #boot{position:absolute;inset:0;z-index:19;display:flex;align-items:center;justify-content:center;
    background:var(--bg);font-size:12px;color:#7ee787;letter-spacing:1px;
    animation:bootOut .75s ease .25s both}
  #boot.hide{display:none}
  @keyframes bootOut{to{opacity:0}}
  .t-logo{font-family:var(--disp);font-size:29px;line-height:1.12;letter-spacing:-1px;margin:14px 0 0}
  .t-logo span{color:#ffd76e;display:block}
  .t-tag{color:var(--dim);font-size:11px;line-height:1.75;margin:9px 0 0}
  .t-rule{display:flex;gap:6px;margin:15px 0 4px;flex-wrap:wrap}
  .t-rule div{font-size:9.5px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:4px 9px}
  .t-stages{display:flex;flex-direction:column;gap:7px;margin:14px 0 0}
  .t-st{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;background:#111726}
  .t-st b{font-family:var(--disp);font-size:17px;flex:0 0 auto;line-height:1}
  .t-st .ts-n{font-size:12px;font-weight:700}
  .t-st .ts-d{font-size:9.5px;color:var(--dim);line-height:1.6;margin-top:3px}
  .t-st .ts-b{font-size:9px;color:#ff9b93;margin-top:4px}
  .t-btns{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:7px}
  .t-btns .row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  #t-start{min-height:52px;font-size:14px}
  .t-back{margin-bottom:10px}
  .t-body{font-size:11.5px;line-height:1.8;color:var(--dim)}
  .t-body h5{color:var(--txt);font-size:12px;margin:14px 0 5px;font-family:var(--disp)}
  .t-body h5:first-child{margin-top:0}
  .t-body b{color:var(--txt)}

  /* ── 스테이지 진입 카드 */
  #stagecard{position:absolute;left:8px;right:8px;top:50%;z-index:7;
    animation:cardIn .5s cubic-bezier(.22,1,.36,1) both;
    background:rgba(10,14,24,.94);border:1px solid #2b3859;border-radius:12px;padding:16px 15px;
    text-align:center;pointer-events:none;transition:opacity .45s ease}
  @keyframes cardIn{from{opacity:0;transform:translateY(-40%) scale(.94)}
    to{opacity:1;transform:translateY(-50%) scale(1)}}
  #stagecard.hide{display:none}
  #stagecard .sc-n{font-size:10px;letter-spacing:2px;color:#ffd76e}
  #stagecard h3{font-family:var(--disp);font-size:20px;margin:5px 0 3px}
  #stagecard .sc-s{font-size:10.5px;color:var(--dim)}
  #stagecard .sc-d{font-size:10.5px;color:var(--dim);line-height:1.7;margin-top:9px;
    border-top:1px solid var(--line);padding-top:9px}
  .banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(9,12,21,.94);text-align:center;gap:13px;padding:26px;z-index:6}
  .banner h2{font-family:var(--disp);font-size:21px;margin:0}
  .banner p{color:var(--dim);font-size:11.5px;margin:0;line-height:1.85}
  .banner button{min-height:44px;padding:10px 22px}
  .hide{display:none}

  /* ══════════ PC 레이아웃 ══════════ */
  @media (min-width:1000px){
    body{padding:0}
    .app{max-width:1180px;height:100vh;padding:14px 18px;gap:10px;
      display:grid;grid-template-columns:minmax(0,1fr) 360px;
      grid-template-rows:auto minmax(0,1fr) auto auto;
      grid-template-areas:"hud side" "board side" "strip side" "ctrl side";
      column-gap:18px}
    .hud{grid-area:hud;grid-template-columns:repeat(5,1fr);gap:8px}
    .stat{padding:8px 6px;border-radius:9px}
    .stat i{font-size:9px}
    .stat b{font-size:17px}
    .board{grid-area:board;max-width:none;min-height:0;border-radius:12px}
    .ustrip{grid-area:strip;min-height:46px;padding:8px 14px}
    .ustrip em{font-size:13px} .ustrip span{font-size:11.5px}
    .controls{grid-area:ctrl;max-width:none;grid-template-columns:repeat(8,1fr);gap:8px}
    .controls button{min-height:56px;font-size:12.5px}
    .controls button small{font-size:9.5px}

    /* 오른쪽 상시 패널 — 시트를 도킹해서 씁니다 */
    #sidedock{grid-area:side;display:flex !important;flex-direction:column;min-height:0;
      background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    #sidedock .dockhead{display:flex;align-items:center;justify-content:space-between;
      padding:12px 14px;border-bottom:1px solid var(--line);font-family:var(--disp);font-size:14px}
    #sheet{position:static;transform:none !important;max-height:none;flex:1;min-height:0;width:auto;max-width:none;
      border:0;border-radius:0;background:transparent;box-shadow:none}
    #sheet .sh{background:transparent;border-bottom:1px solid var(--line)}
    #sheet-body{flex:1;min-height:0}
    #scrim{display:none}
    /* 데스크톱에서는 시트를 항상 열어둡니다 */
    #sheet{transform:none}

    #title{padding:40px 60px}
    .t-logo{font-size:44px}
    .t-tag{font-size:13px}
    .t-stages{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .t-st{flex-direction:column;gap:6px}
    .t-btns{flex-direction:row;gap:10px;max-width:560px}
    #t-start{flex:2;min-height:58px}
    .t-btns .row2{flex:1;grid-template-columns:1fr 1fr}
    #stagecard{left:50%;transform:translate(-50%,-50%);width:420px;right:auto}
    @keyframes cardIn{from{opacity:0;transform:translate(-50%,-40%) scale(.94)}
      to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
    button:hover:not(:disabled){background:#1b2338;border-color:#3d4b6e}
    .nchip:hover:not(:disabled),.dcard:hover{transform:translateY(-2px)}
  }
  @media (min-width:1000px) and (max-height:820px){ .controls button{min-height:48px} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const WIDE = matchMedia('(min-width:1000px)').matches;
const MAP = WIDE ? MAPS.landscape : MAPS.portrait;

const pathSet = new Set();
(function(){
  for (let i=0;i<WP.length-1;i++){
    let [x,y] = WP[i]; const [tx,ty] = WP[i+1];
    const dx = Math.sign(tx-x), dy = Math.sign(ty-y);
    while (x!==tx || y!==ty){ pathSet.add(x+','+y); x+=dx; y+=dy; }
  }
  const L = WP[WP.length-1]; pathSet.add(L[0]+','+L[1]);
})();
const px = t => t*TS + TS/2;
// 판을 빠르게 굴리기 위한 전역 페이스. 이동이 빨라진 만큼 체력을 낮춰 난이도는 유지합니다.
const PACE = 1.3, HP_ADJ = 0.78;

// ═══════════════════════════════ 상태
const S = {

  allyBuff:0, allyMul:0, pulses:[], corpses:[], res:{atk:0,spd:0,cap:0,mem:0,gold:0,ult:0}, buy:{draft:0,tier:0,named:0}, autoUlt:true, tk:{draft:1, tier:0, named:0}, seen:{draft:0, tier:0, named:0},
};

const namedCost = id => Math.round(NAMED[U[id].t] * Math.pow(NAMED_UP, S.named[id]||0) / 10) * 10;

const easeOut     = t => 1 - Math.pow(1-t, 3);
const easeOutBack = t => { const c=1.70158+1; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); };
const easeInOut   = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
const easeOutQuint= t => 1 - Math.pow(1-t, 5);

const LOGS = [];
function log(msg, hi){

// ═══════════════════════════════ 소환 · 합성 · 이동
const occupied = (x,y) => S.units.some(u => u.tx===x && u.ty===y);
const buildable = (x,y) => x>=0 && x<COLS && y>=0 && y<ROWS && !pathSet.has(x+','+y);
function freeTiles(){
  const out = [];
  for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++)
    if (buildable(x,y) && !occupied(x,y)) out.push([x,y]);
  return out;
}
// force = true 이면 칸 제한을 무시합니다(합성·제작처럼 재료를 먼저 소모하는 경우).
function place(id, force){
  const free = freeTiles();
  if (!free.length) return null;
  if (!force && S.units.length >= S.cap) return null;
  const [x,y] = free[(Math.random()*free.length)|0];
  const u = {id, tx:x, ty:y, x:px(x), y:px(y), cd:0, ramp:0, last:null, chg:0, chgVis:0, hasteT:0, age:0, kx:0, ky:0};
  S.units.push(u);
  return u;
}
function sellValue(u){ return SELL[U[u.id].t]; }
function sellSelected(){
  const u = S.sel;
  if (!u || !S.units.includes(u)) return;
  if (u.lock) return log('잠긴 유닛입니다. 잠금부터 해제하세요.');
  const t = U[u.id].t;
  if (t >= 3 && S.sellArm !== u){          // 영웅 이상은 한 번 더 확인
    S.sellArm = u;
    setTimeout(() => { if (S.sellArm === u){ S.sellArm = null; sync(); } }, 2400);
    sync(); return;
  }
  const v = sellValue(u);
  S.units = S.units.filter(o => o !== u);
  S.gold += v; S.sel = null; S.sellArm = null;
  FX({k:'pop', x:u.x, y:u.y, c:'#ff7b72', life:.35, max:.35});
  log(`판매: ${U[u.id].n} → +${v}G`);
  sync();
}
function rollTier(floor){
  const lo = floor || 0;
  let total = 0;
  for (let i=lo;i<RATES.length;i++) total += RATES[i];
  let r = Math.random()*total, acc = 0;
  for (let i=lo;i<RATES.length;i++){ acc += RATES[i]; if (r < acc) return i; }
  return lo;
}
// 천장을 반영한 등급 추첨. 영웅 이상이 나오면 카운터가 초기화됩니다.
function rollWithPity(){
  if (S.pity >= PITY_MAX){ S.pity = 0; return {t:rollTier(3), pity:true}; }
  const t = rollTier();
  if (t >= 3) S.pity = 0; else S.pity++;
  return {t, pity:false};
}
function summon(){
  if (S.gold < 100) return log('골드가 부족합니다.');
  if (S.units.length >= S.cap) return log('칸이 가득 찼습니다. 판매나 합성으로 자리를 비우세요.');
  S.gold -= 100;
  const {t, pity} = rollWithPity();
  const pool = BY_TIER[t];
  const id = pool[(Math.random()*pool.length)|0];
  const u = place(id);
  if (u){
    S.sel = u; spawnPop(u);
    log((pity ? '천장 확정! ' : '소환: ') + `${U[id].n} [${TIER[t].n}]`, t>=3);
  } else { S.gold += 100; log('배치할 자리가 없습니다.'); }
  if (S.auto) autoMerge();
  sync();
}
// 5연 소환 — 고급 이상 2개가 보장됩니다.
function multiSummon(){
  if (S.gold < MULTI_COST) return log('골드가 부족합니다.');
  if (S.cap - S.units.length < MULTI_N) return log(`${MULTI_N}칸이 비어 있어야 합니다.`);
  S.gold -= MULTI_COST;
  const got = [];
  for (let i=0;i<MULTI_N;i++){
    const short = 2 - got.filter(t => t>=1).length;   // 남은 보장 수량
    let t, pity = false;
    if (short >= MULTI_N - i){ t = rollTier(1); }      // 보장 발동
    else { const r = rollWithPity(); t = r.t; pity = r.pity; }
    const pool = BY_TIER[t];
    const id = pool[(Math.random()*pool.length)|0];
    const u = place(id);
    if (!u) break;
    got.push(t); S.sel = u; spawnPop(u);
    if (pity) log(`천장 확정! ${U[id].n} [${TIER[t].n}]`, true);
  }
  const best = Math.max(...got, 0);
  log(`5연 소환 → ${got.map(t=>TIER[t].n).join(' ')}`, best>=3);
  if (S.auto) autoMerge();
  sync();
}
function pickSummon(t){
  const need = TIER_COST[t];
  if (S.tk.tier < need) return log(`등급권이 ${need}장 필요합니다.`);
  if (S.units.length >= S.cap) return log('칸이 가득 찼습니다.');
  S.tk.tier -= need;
  const rt = rollTier(t);
  const id = BY_TIER[rt][(Math.random()*BY_TIER[rt].length)|0];
  const u = place(id);
  if (u){
    S.sel = u; spawnPop(u);
    log(`${TIER[t].n}↑ 보장 · ${U[id].n} [${TIER[rt].n}]` + (rt>t ? ' 상향!' : ''), rt>t || rt>=3);
  } else { S.tk.tier += need; log('배치할 자리가 없습니다.'); }
  renderGacha(); sync();
}
// 유닛 지목 — 원하는 유닛이 확정으로 나옵니다.
function namedSummon(id){
  const need = NAMED_COST[U[id].t];
  if (S.tk.named < need) return log(`지목권이 ${need}장 필요합니다.`);
  if (S.units.length >= S.cap) return log('칸이 가득 찼습니다.');
  S.tk.named -= need;
  const u = place(id);
  if (u){
    S.named[id] = (S.named[id]||0) + 1;
    S.sel = u; spawnPop(u);
    log(`지목 소환 → ${U[id].n}`, U[id].t>=3);
  } else { S.tk.named += need; log('배치할 자리가 없습니다.'); }
  renderGacha(); sync();
}
// 3택 드래프트 — 후보 3장을 굴려 그중 하나만 데려갑니다.
const DRAFT_COST = 300;
function buyResearch(k){
  const r = RESEARCH.find(x => x.k === k);
  if (S.res[k] >= r.max) return;
  const cost = resCost(r);
  if (S.gold < cost) return log('골드가 부족합니다.');
  S.gold -= cost; S.res[k]++;
  if (k === 'cap') S.cap += 1;
  if (k === 'mem'){ S.maxLife = (S.maxLife||20) + 2; S.life += 2; }
  log(`연구 완료 · ${r.n} Lv.${S.res[k]}`, true);
  sync();
}
function buyTicket(k){
  const s = SHOP.find(x => x.k === k);
  const cost = shopCost(s);
  if (S.gold < cost) return log('골드가 부족합니다.');
  S.gold -= cost; S.buy[k]++; S.tk[k]++;
  log(`구매 · ${s.n} +1`, true);
  sync();
}
function grantTicket(kind, n){ S.tk[kind] += n; }
const ticketAlerts = () => Object.keys(TICKET).filter(k => S.tk[k] > (S.seen[k]||0));
const ticketTotal  = () => Object.keys(TICKET).reduce((a,k) => a + S.tk[k], 0);

function draftRoll(){
  if (S.draft) return;
  if (S.units.length >= S.cap) return log('칸이 가득 찼습니다.');
  if (S.tk.draft <= 0) return log('드래프트권이 없습니다.');
  S.tk.draft -= 1;
  S.draft = [0,1,2].map(() => {
    const r = rollWithPity();
    return {id: BY_TIER[r.t][(Math.random()*BY_TIER[r.t].length)|0], pity: r.pity};
  });
  log('드래프트 · 3장 중 하나를 고르세요', true);
  sync();
}
function draftTake(i){
  if (!S.draft) return;
  const id = S.draft[i].id;
  S.draft = null;
  const u = place(id, true);
  if (u){ S.sel = u; spawnPop(u); log(`드래프트 · ${U[id].n} [${TIER[U[id].t].n}]`, U[id].t>=3); }
  if (S.auto) autoMerge();
  sync();
}
function spawnPop(u){ S.fx.push({k:'pop', x:u.x, y:u.y, c:TIER[U[u.id].t].hex, life:.45, max:.45}); }
function mergeGroups(maxTier){
  const cnt = {};
  for (const u of S.units) if (!u.lock) cnt[u.id] = (cnt[u.id]||0)+1;
  return Object.keys(cnt).filter(id => cnt[id] >= 3 && U[id].t <= maxTier);
}
function doMerge(id){
  let removed = 0;
  S.units = S.units.filter(u => { if (u.id===id && !u.lock && removed<3){ removed++; return false; } return true; });
  const nt = U[id].t + 1, pool = BY_TIER[nt];
  const nid = pool[(Math.random()*pool.length)|0];
  const u = place(nid, true);   // 재료 3개를 이미 뺐으므로 칸은 반드시 남습니다
  log(`합성: ${U[id].n} x3 → ${U[nid].n} [${TIER[nt].n}]`, nt>=3);
  if (u){ S.sel = u; spawnPop(u); }
}
function mergeOnce(){
  const g = mergeGroups(3);
  if (!g.length) return log('같은 유닛 3개가 필요합니다.');
  g.sort((a,b) => U[b].t - U[a].t);
  doMerge(g[0]); sync();
}
function autoMerge(){
  let guard = 0;
  while (guard++ < 40){
    const need = reservedCounts();                 // 조합에 필요한 최소 보유량
    const c = {};
    for (const u of S.units) if (!u.lock) c[u.id] = (c[u.id]||0)+1;
    const g = Object.keys(c).filter(id =>
      U[id].t <= 1 && c[id] - (need[id]||0) >= 3);  // 재료분을 빼고도 3개 남을 때만
    if (!g.length) break;
    doMerge(g[0]);
  }
}
// 재료가 1개만 모자란 조합까지 포함해, 남겨둬야 할 유닛 수량
function reservedCounts(){
  const out = {};
  for (const s of recipeStatus()){
    if (s.miss.length > 1) continue;
    for (const k in s.need) out[k] = Math.max(out[k]||0, s.need[k]);
  }
  return out;
}
function craft(i){
  const r = RECIPES[i], pool = S.units.slice(), take = [];
  for (const need of r.need){
    const j = pool.findIndex(u => u.id === need);
    if (j < 0) return;
    take.push(pool.splice(j,1)[0]);
  }
  S.units = S.units.filter(u => !take.includes(u));   // 재료를 먼저 소모한 뒤
  const u = place(r.id, true);                        // 칸 제한 무시하고 배치
  log(`◆ 신화 제작: ${U[r.id].n} ◆`, true);
  if (u){ S.sel = u; spawnPop(u); }
  sync();
}

// ═══════════════════════════════ 웨이브
// 웨이브가 갈수록 성장률 자체가 빨라집니다 (초반 완만 → 후반 급가속)
// 웨이브가 갈수록 성장률 자체가 빨라집니다 (초반 완만 → 후반 급가속)
function growth(w, g0, g1){
  let m = 1;
  for (let i=1;i<w;i++) m *= g0 + (g1-g0) * Math.min(1, (i-1)/59);
  return m;
}
function buildWave(w){
  const q = [];
  const baseMul  = growth(w, 1.020, 1.253);
  const eliteMul = growth(w, 1.018, 1.204);
  const bossMul  = growth(w, 1.018, 1.190);   // 보스만 소폭 하향
  const ELITE = {leak:1, inf:1, fork:1, gc:1, miss:1, opt:1, child:1,
                 thread:1, sema:1, packet:1, retry:1, page:1, zombie:1};
  const count = Math.min(30, 7 + Math.floor(w*0.55));
  const add = (t, f) => {
    const n = Math.floor(count*f);
    for (let i=0;i<n;i++) q.push({type:t, hpMul: ELITE[t] ? eliteMul : baseMul});
  };
  const one = t => q.push({type:t, hpMul: bossMul});

  const st = stageOf(w), sw = stageWave(w), SG = STAGES[st];
  if (sw === 4)  one(SG.minis[0]);
  if (sw === 7)  one(SG.minis[1]);
  if (sw === 10) one(SG.last);

  if (st === 0){
    add('bug', 0.45);
    if (sw >= 2) add('warn', 0.24);
    if (sw >= 3) add('nul', 0.20);
    if (sw >= 5) add('exc', 0.18);
  } else if (st === 1){
    add('bug', 0.25); add('nul', 0.15); add('exc', 0.15);
    add('leak', 0.17); add('fork', 0.16);
    if (sw >= 4) add('gc', 0.10);
    if (sw >= 6) add('inf', 0.12);
  } else if (st === 2){
    add('bug', 0.18); add('exc', 0.12); add('leak', 0.12); add('fork', 0.14);
    add('inf', 0.12); add('gc', 0.08); add('miss', 0.16); add('opt', 0.14);
  } else if (st === 3){
    add('bug', 0.12); add('exc', 0.10); add('leak', 0.10); add('fork', 0.12);
    add('inf', 0.10); add('miss', 0.12); add('opt', 0.12);
    add('thread', 0.16); if (sw >= 3) add('sema', 0.12);
  } else if (st === 4){
    add('exc', 0.08); add('fork', 0.10); add('inf', 0.10); add('miss', 0.12);
    add('opt', 0.12); add('thread', 0.12); add('sema', 0.10);
    add('packet', 0.16); if (sw >= 3) add('retry', 0.12);
  } else {
    add('opt', 0.10); add('miss', 0.10); add('thread', 0.10); add('sema', 0.08);
    add('packet', 0.12); add('retry', 0.12);
    add('page', 0.16); add('zombie', 0.14);
  }
  if (sw >= 4 && sw % 3 === 1) add('bug', 0.35);

  for (let i=q.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [q[i],q[j]]=[q[j],q[i]]; }
  return q;
}
function showStageCard(st){
  const s = STAGES[st], el = $('stagecard');
  el.innerHTML = `<div class="sc-n">STAGE ${st+1}</div><h3>${s.name}</h3>
    <div class="sc-s">${s.sub}</div><div class="sc-d">${s.desc}<br>
    <b style="color:#ff9b93">보스 · ${s.boss}</b></div>`;
  el.classList.remove('hide'); el.style.opacity = '1';
  clearTimeout(showStageCard.t1); clearTimeout(showStageCard.t2);
  showStageCard.t1 = setTimeout(() => el.style.opacity = '0', 3400);
  showStageCard.t2 = setTimeout(() => el.classList.add('hide'), 3900);
}
function startWave(){
  S.wave++;
  if (S.wave > S.maxWave) return victory();
  if (stageWave(S.wave) === 1) showStageCard(stageOf(S.wave));
  S.queue = buildWave(S.wave);
  S.phase = 'wave'; S.spawnT = 0;
  $('btn-skip').classList.add('hide');
  log(`── WAVE ${S.wave} 실행 (적 ${S.queue.length}) ──`, true);
  sync();
}
function endWave(){
  const bonus = 70 + S.wave*14;
  S.gold += bonus;
  const got = [];
  if (S.wave % 3 === 0){ grantTicket('draft', 1); got.push('드래프트권'); }
  if (S.wave % 6 === 0){ grantTicket('tier', 1);  got.push('등급권'); }
  if (S.wave % 8 === 0){ grantTicket('named', 1); got.push('지목권'); }
  log(`WAVE ${S.wave} 클리어 · +${bonus}G` + (got.length ? ' · ' + got.join(', ') : ''));
  if (S.wave >= S.maxWave){
    // 최종 보스를 잡지 못한 채 웨이브가 끝났다면 승리가 아닙니다
    if (!S.finalDown) return gameOver('최종 보스를 놓쳤습니다');
    return victory();
  }
  S.phase = 'prep'; S.prep = 3.5;
  $('btn-skip').classList.remove('hide');
  sync();
}
function spawn(item, at){
  const b = ENEMY[item.type], hp = Math.max(1, Math.round(b.hp*item.hpMul*HP_ADJ));
  const e = {
    type:item.type, hp, max:hp, hpMul:item.hpMul,
    x: at ? at.x : px(WP[0][0]), y: at ? at.y : px(WP[0][1]),
    wp: at ? at.wp : 1, dist: at ? at.dist : 0,
    slow:0, sp:b.sp*PACE, r:b.r, c:b.c, boss:!!b.boss, ph:Math.random()*6,
    spdMul:1, healed:0, enraged:false,
    age:0, flash:0, ang:Math.PI/2, hpGhost:hp, bob:Math.random()*6,
    shield: b.shield ? Math.round(hp*b.shield) : 0,
    shieldMax: b.shield ? Math.round(hp*b.shield) : 0,
    hidden:false, stTimer: b.stealth ? b.stealth.off*Math.random() : 0,

}
function victory(){
  if (S.over) return;

  banner('BUILD SUCCESSFUL', `${S.maxWave} 웨이브, 세 스테이지를 모두 방어했습니다.<br>남은 메모리 ${S.life} · 처치 ${S.killed}`);
}

  banner('SEGMENTATION FAULT', `STAGE ${stageOf(S.wave)+1} · ${STAGES[stageOf(S.wave)].name}<br>
    ${reason || `WAVE ${S.wave}에서 메모리가 모두 소진됐습니다`}<br>처치 ${S.killed}`);
}
// 한 판이 끝나면 연구·소환권·유닛은 전부 사라집니다. 다음 판은 맨손에서 시작합니다.
function resetRun(){
  S.gold = 300; S.life = 20; S.maxLife = 20; S.wave = 0; S.phase = 'idle'; S.prep = 0;
  S.over = false; S.finalDown = false; S.paused = false; S.speed = 1; S.killed = 0;
  S.units = []; S.enemies = []; S.corpses = []; S.fx = []; S.texts = []; S.pulses = [];
  S.queue = []; S.spawnT = 0; S.sel = null; S.sellArm = null; S.drag = null; S.draft = null;
  S.cap = 22; S.allyBuff = 0; S.allyMul = 0;
  S.res = {atk:0, spd:0, cap:0, mem:0, gold:0, ult:0};
  S.buy = {draft:0, tier:0, named:0};

  LOGS.length = 0;
  lastSig = '';
  $('banner').classList.add('hide');
  $('stagecard').classList.add('hide');
  titleMain();
  $('title').classList.remove('hide');
  sync();
}

const TXT = t => { if (S.texts.length > 44) S.texts.splice(0, 12); S.texts.push(t); };

// ═══════════════════════════════ 전투
let SRC = null;                     // 지금 공격 중인 유닛 (게이지 충전 귀속)
function dmgTo(e, amount, color, big){
  const b = ENEMY[e.type];
  const before = e.hp + e.shield;
  const armor = (b.armor||0) + (e.auraArmor||0);          // 세마포어·뮤텍스가 덧씌운 장갑 포함
  if (armor) amount = Math.max(amount*0.1, amount - armor);   // 장갑: 고정 감소 (최소 10%는 통과)
  if (e.shield > 0){                                              // 보호막이 먼저 닳습니다
    const ab = Math.min(e.shield, amount);
    e.shield -= ab; amount -= ab;
    FX({k:'pop', x:e.x, y:e.y, c:'#8ab4ff', life:.18, max:.18});
    if (amount <= 0) return;
  }
  e.hp -= amount;
  e.flash = 0.14;                                   // 맞을 때 흰 섬광
  if (big) TXT({x:e.x, y:e.y-16, v:Math.round(amount), life:.9, max:.9, c:color||'#fff'});
  if (SRC){
    const g = U[SRC.id].ult;
    if (g && g.g === 'dmg') SRC.chg += Math.max(0, before - (e.hp + e.shield)) * ultRate();
  }
  if (e.hp <= 0 && !e.dead && b.revive && !e.revived){    // 1회 부활
    e.revived = true;
    e.hp = Math.round(e.max * b.revive);
    e.shield = e.shieldMax;
    e.flash = 0.3;
    FX({k:'wave', x:e.x, y:e.y, r:TS*2.2, c:e.c, n:2, life:.7, max:.7});
    TXT({x:e.x, y:e.y-26, v:'REVIVE', life:1.1, max:1.1, c:e.c});
    return;
  }
  if (e.hp <= 0 && !e.dead){
    e.dead = true;
    S.gold += Math.round(b.gold * (1 + S.wave*0.05) * (1 + 0.08*S.res.gold));
    S.killed++;
    FX({k:'pop', x:e.x, y:e.y, c:e.c, life:.3, max:.3});
    S.corpses.push({x:e.x, y:e.y, r:e.r, c:e.c, shape:b.shape, ang:e.ang, t:.32, max:.32});
    if (SRC){ const g = U[SRC.id].ult; if (g && g.g === 'kill') SRC.chg += ultRate(); }
    if (b.boss){
      log(`◆ ${b.n} 격파! ◆`, true);
      grantTicket('named', 1);
      FX({k:'wave', x:e.x, y:e.y, r:TS*5, c:e.c, n:3, life:.9, max:.9});
      if (e.type === FINAL_BOSS) S.finalDown = true;
    }
    if (b.split){                                                 // 포크 폭탄: 죽으면서 갈라짐
      for (let i=0;i<b.split.n;i++){
        const c = spawn({type:b.split.type, hpMul:e.hpMul},
                        {x:e.x + (i?12:-12), y:e.y, wp:e.wp, dist:e.dist});
        c.spawnFlash = .5;
      }
    }
  }
}
function buffOf(u){
  let m = (S.allyBuff > 0 ? 1 + S.allyMul : 1) * (1 + 0.05*S.res.atk);   // 연구: 공격력
  for (const o of S.units)
    if (o.id==='fn' && o!==u && Math.abs(o.tx-u.tx)<=1 && Math.abs(o.ty-u.ty)<=1) m += U.fn.sp.mul;
  return m;
}
function inRange(u, sp){
  const R = (sp.global || U[u.id].rng >= 90) ? Infinity : U[u.id].rng*TS;
  const out = [];
  for (const e of S.enemies){
    if (e.dead || e.hidden) continue;          // 캐시미스: 사라진 동안 조준 불가
    if (R === Infinity){ out.push(e); continue; }
    const dx=e.x-u.x, dy=e.y-u.y;
    if (dx*dx+dy*dy <= R*R) out.push(e);
  }
  return out;
}
// ══════════════ 스킬 · 궁극기
function allEnemies(){ return S.enemies.filter(e => !e.dead && !e.hidden); }
function castEffect(u, ef, base, col, isUlt){
  const list = allEnemies();
  if (!list.length && ef.f !== 'ally' && ef.f !== 'ramp') return false;
  list.sort((a,b) => b.dist - a.dist);
  const near = r => list.filter(e => (e.x-u.x)**2 + (e.y-u.y)**2 <= (r*TS)**2);
  const boom = (x,y,r) => FX({k:'wave', x, y, r, c:col, n:isUlt?3:2, life:isUlt?.9:.6, max:isUlt?.9:.6});

  switch (ef.f){
    case 'all':      for (const e of list) dmgTo(e, base*ef.mul, col, true);
                     boom(cv.width/2, cv.height/2, Math.max(cv.width,cv.height)); break;
    case 'allSlow':  for (const e of list){ dmgTo(e, base*ef.mul, col, true); e.slow = Math.max(e.slow, ef.dur); }
                     boom(cv.width/2, cv.height/2, Math.max(cv.width,cv.height)); break;
    case 'area':   { const t = list[0], hit = near(ef.r);
                     for (const e of hit) dmgTo(e, base*ef.mul, col, true);
                     boom(t.x, t.y, ef.r*TS); break; }
    case 'top':      for (const e of list.slice(0, ef.k)){ dmgTo(e, base*ef.mul, col, true); beam(u, e, col, 3); } break;
    case 'topHp':  { const s = list.slice().sort((a,b) => b.hp - a.hp);
                     for (const e of s.slice(0, ef.k)){ dmgTo(e, base*ef.mul, col, true); beam(u, e, col, 4); } break; }
    case 'burst':  { const e = list[0]; let d = base*ef.mul;
                     for (let i=0;i<ef.k;i++){ dmgTo(e, d, col); d *= ef.fall; }
                     FX({k:'rings', x:e.x, y:e.y, r:e.r+30, n:6, c:col, life:.7, max:.7}); break; }
    case 'chain':  { let cur = list[0], d = base*ef.mul, used = new Set([cur]), from = u;
                     for (let i=0;i<ef.k;i++){
                       dmgTo(cur, d, col); beam(from, cur, col, 3); from = cur; d *= ef.fall;
                       let nx = null, best = 1e9;
                       for (const e of list){ if (e.dead || used.has(e)) continue;
                         const dd = (e.x-cur.x)**2 + (e.y-cur.y)**2; if (dd < best){ best = dd; nx = e; } }
                       if (!nx) break; cur = nx; used.add(cur);
                     } break; }
    case 'pct':    { const e = list[0]; dmgTo(e, e.hp*ef.pct + base, col, true);
                     label(e, Math.round(ef.pct*100)+'%', col, -28); beam(u, e, col, 4); break; }
    case 'pctSlow':{ const e = list[0]; dmgTo(e, e.hp*ef.pct + base, col, true);
                     for (const o of list) o.slow = Math.max(o.slow, ef.dur);
                     label(e, Math.round(ef.pct*100)+'%', col, -28); break; }
    case 'pctAll':   for (const e of list){ dmgTo(e, e.hp*ef.pct, col, true); }
                     boom(cv.width/2, cv.height/2, Math.max(cv.width,cv.height)); break;
    case 'exec':   { const e = list[0];
                     if (e.boss) dmgTo(e, e.hp*ef.pct, col, true);
                     else { dmgTo(e, e.hp + e.shield, col, true); label(e, 'FOUND', col, -28); }
                     break; }
    case 'deep':     for (const e of list.slice(0, ef.k)){ dmgTo(e, e.hp*ef.pct + base*ef.mul, col, true); beam(u, e, col, 3); } break;
    case 'freeze':   for (const e of list){ dmgTo(e, base*ef.mul, col, true); e.slow = Math.max(e.slow, ef.dur); e.frozen = ef.dur; }
                     boom(cv.width/2, cv.height/2, Math.max(cv.width,cv.height)); break;
    case 'pulse':  { for (let i=0;i<ef.n2;i++) S.pulses.push({u, mul:ef.mul, col, t:i*0.28, base}); break; }
    case 'rampNuke':{ const e = list[0]; const sp = U[u.id].sp;
                     const mult = 1 + (u.ramp || 0);
                     dmgTo(e, base*mult*ef.mul, col, true); beam(u, e, col, 6);
                     FX({k:'rings', x:e.x, y:e.y, r:e.r+40, n:5, c:col, life:.8, max:.8}); break; }
    case 'ramp':   { u.ramp = (U[u.id].sp.max || 3.2) - 1; u.hasteT = ef.dur; break; }
    case 'ally':     S.allyBuff = ef.dur; S.allyMul = ef.mul;
                     for (const o of S.units) FX({k:'pop', x:o.x, y:o.y, c:col, life:.5, max:.5}); break;
  }
  return true;
}
const ultRate = () => 1 + 0.10*S.res.ult;
function ultReady(u){ const g = U[u.id].ult; return !!g && u.chg >= g.need; }
function castUlt(u){
  const g = U[u.id].ult;
  if (!g || u.chg < g.need) return false;
  u.chg = 0;
  const col = TIER[U[u.id].t].hex;
  castEffect(u, g, U[u.id].dmg * buffOf(u), col, true);
  TXT({x:cv.width/2, y:cv.height*0.42, v:'◆ ' + g.n, life:1.5, c:col});
  log(`◆ 궁극기 · ${U[u.id].n} — ${g.n}`, true);
  return true;
}
function castAllUlts(){
  const ready = S.units.filter(ultReady);
  if (!ready.length) return log('충전된 궁극기가 없습니다.');
  for (const u of ready) castUlt(u);
  sync();
}

function attack(u){
  const def = U[u.id], sp = def.sp, col = TIER[def.t].hex;
  SRC = u;
  const vis = VIS[u.id] || ((a,h,c)=>beam(a,h[0],c,2));

  if (sp.t === 'buff'){
    const near = S.units.filter(o => o!==u && Math.abs(o.tx-u.tx)<=1 && Math.abs(o.ty-u.ty)<=1 && U[o.id].sp.t!=='buff');
    if (!near.length) return false;
    vis(u, near, col, {});
    return true;
  }
  const list = inRange(u, sp);
  if (!list.length) return false;
  list.sort((a,b) => b.dist - a.dist);
  const base = def.dmg * buffOf(u);
  let hits = [], meta = {};

  switch (sp.t){
    case 'single': { const e=list[0]; dmgTo(e, base, col); hits=[e]; break; }
    case 'crit': { const e=list[0], on=Math.random()<sp.p; dmgTo(e, base*(on?sp.mul:1), col, on); hits=[e]; meta.crit=on; break; }
    case 'weak': { const e=list[0], low=e.hp<e.max/2; dmgTo(e, base*(low?sp.mul:1), col, low); hits=[e]; meta.weak=low; break; }
    case 'multi': { hits=list.slice(0,sp.k); for (const e of hits) dmgTo(e, base, col); break; }
    case 'multiHit': { const e=list[0]; let d=base; for (let i=0;i<sp.k;i++){ dmgTo(e,d,col); d*=(sp.fall??1); } hits=[e]; break; }
    case 'chain': {
      let cur=list[0], d=base, used=new Set([cur]);
      hits=[cur];
      for (let i=0;i<sp.k;i++){
        dmgTo(cur, d, col); d*=sp.fall;
        let next=null, best=1e9;
        for (const e of list){
          if (e.dead || used.has(e)) continue;
          const dd=(e.x-cur.x)**2+(e.y-cur.y)**2;
          if (dd<best){ best=dd; next=e; }
        }
        if (!next) break;
        cur=next; used.add(cur); hits.push(cur);
      }
      break;
    }
    case 'aoe': {
      const t=list[0], R=sp.r*TS;
      meta.cx=t.x; meta.cy=t.y; meta.r=R;
      for (const e of S.enemies){
        if (e.dead) continue;
        if ((e.x-t.x)**2+(e.y-t.y)**2 <= R*R){ dmgTo(e, base, col, def.t===5); hits.push(e); }
      }
      if (!hits.length) hits=[t];
      break;
    }
    case 'snipeMax': { let e=list[0]; for (const o of list) if (o.hp>e.hp) e=o; dmgTo(e, base, col, true); hits=[e]; break; }
    case 'snipeLast': { const e=list[list.length-1]; dmgTo(e, base, col); hits=[e]; break; }
    case 'global': { const e=list[0]; dmgTo(e, base, col); hits=[e]; break; }
    case 'execute': {
      const e=list[0], go=!e.boss && Math.random()<sp.p;
      if (go) dmgTo(e, e.hp, col, true); else dmgTo(e, base, col);
      hits=[e]; meta.exec=go; break;
    }
    case 'rampUp': {
      const e=list[0];
      u.ramp = (u.last===e) ? Math.min(sp.max-1, u.ramp+sp.step) : 0;
      u.last=e;
      dmgTo(e, base*(1+u.ramp), col, u.ramp>1);
      hits=[e]; meta.ramp=u.ramp; break;
    }
    case 'slowNuke': {
      const e=list[0];
      dmgTo(e, base, col, true);
      for (const o of S.enemies) if (!o.dead) o.slow = Math.max(o.slow, sp.dur);
      hits=[e]; break;
    }
  }
  if (hits.length){
    vis(u, hits, col, meta);
    const t0 = hits[0], dx = t0.x-u.x, dy = t0.y-u.y, dl = Math.hypot(dx,dy) || 1;
    u.kx = -dx/dl * 3.5; u.ky = -dy/dl * 3.5;      // 쏘면서 살짝 뒤로 밀림
  }

  const g = def.ult;
  if (g && g.g === 'hit') u.chg += ultRate();
  if (def.sk && Math.random() < def.sk.p){            // 스킬 발동
    castEffect(u, def.sk, def.dmg * buffOf(u), col, false);
    TXT({x:u.x, y:u.y-26, v:def.sk.n, life:1.1, c:col});
    FX({k:'pop', x:u.x, y:u.y, c:col, life:.5, max:.5});
  }
  SRC = null;
  return true;
}

// ═══════════════════════════════ 루프
let prev = performance.now();
function tick(now){
  requestAnimationFrame(tick);
  const dt = Math.min(.05, (now-prev)/1000); prev = now;
  S.t += dt;
  // 어떤 창을 열어도 시간은 계속 흐릅니다. 멈추는 건 직접 누른 일시정지뿐.
  if (!S.over && !S.paused) for (let i=0;i<S.speed;i++) step(dt);
  sync();
  draw();
}
function step(dt){
  if (S.phase==='prep'){ S.prep -= dt; if (S.prep<=0) startWave(); }
  if (S.phase==='wave'){
    S.spawnT -= dt;
    if (S.queue.length && S.spawnT<=0){ spawn(S.queue.shift()); S.spawnT = .32; }
  }
  // 오라 초기화 후 재계산 (가비지컬렉터 회복 / 데드락 가속)
  for (const e of S.enemies) if (!e.dead){ e.spdMul = 1; e.healAura = false; e.auraArmor = 0; }
  for (const a of S.enemies){
    if (a.dead) continue;
    const b = ENEMY[a.type];
    if (!b.heal && !b.haste && !b.armorAura) continue;
    const R = ((b.heal || b.haste || b.armorAura).r) * TS;
    for (const e of S.enemies){
      if (e.dead || e === a) continue;
      if ((e.x-a.x)**2 + (e.y-a.y)**2 > R*R) continue;
      if (b.heal){ e.hp = Math.min(e.max, e.hp + e.max*b.heal.pct*dt); e.healAura = true; }
      if (b.haste) e.spdMul = Math.max(e.spdMul, b.haste.mul);
      if (b.armorAura) e.auraArmor = Math.max(e.auraArmor, b.armorAura.v);
    }
  }
  for (const e of S.enemies){
    if (e.dead) continue;
    const b = ENEMY[e.type];
    if (e.slow>0) e.slow -= dt;
    if (e.spawnFlash > 0) e.spawnFlash -= dt;
    e.age += dt;
    if (e.flash > 0) e.flash -= dt;
    e.hpGhost = lerp(e.hpGhost, e.hp, Math.min(1, dt*4.5));   // 체력바가 부드럽게 따라옴
    e.bob += dt * 6;
    if (b.regen) e.hp = Math.min(e.max, e.hp + e.max*b.regen*dt);
    if (b.shieldRegen && e.shieldMax)                          // 보호막 자가 재생
      e.shield = Math.min(e.shieldMax, e.shield + e.shieldMax*b.shieldRegen*dt);
    if (b.blink){                                              // 레이스 컨디션: 경로 순간이동
      e.blinkT = (e.blinkT ?? b.blink.every) - dt;
      if (e.blinkT <= 0){
        e.blinkT = b.blink.every;
        FX({k:'pop', x:e.x, y:e.y, c:e.c, life:.4, max:.4});
        advanceAlong(e, b.blink.dist);
        FX({k:'pop', x:e.x, y:e.y, c:e.c, life:.4, max:.4});
        TXT({x:e.x, y:e.y-24, v:'BLINK', life:.9, max:.9, c:e.c});
      }
    }
    if (b.stealth){                                  // 캐시미스: 은신/노출 반복
      e.stTimer -= dt;
      if (e.stTimer <= 0){ e.hidden = !e.hidden; e.stTimer = e.hidden ? b.stealth.on : b.stealth.off; }
    }
    if (b.enrage && !e.enraged && e.hp < e.max*b.enrage.at){
      e.enraged = true;
      log(`${b.n} 폭주! 속도가 올라갑니다`, true);
      FX({k:'pop', x:e.x, y:e.y, c:e.c, life:.6, max:.6});
    }
    const tgt = WP[e.wp];
    if (!tgt){ leak(e); continue; }
    const tx=px(tgt[0]), ty=px(tgt[1]);
    const dx=tx-e.x, dy=ty-e.y, d=Math.hypot(dx,dy);
    if (e.frozen > 0) e.frozen -= dt;
    const rage = e.enraged ? b.enrage.mul : 1;
    const v = e.sp * e.spdMul * rage * (e.frozen>0 ? .15 : e.slow>0 ? .55 : 1) * dt;
    let na = Math.atan2(dy, dx);                              // 진행 방향으로 부드럽게 회전
    let diff = ((na - e.ang + Math.PI*3) % (Math.PI*2)) - Math.PI;
    e.ang += diff * Math.min(1, dt*7);
    if (d<=v){ e.x=tx; e.y=ty; e.wp++; } else { e.x+=dx/d*v; e.y+=dy/d*v; }
    e.dist += v;
  }

  S.enemies = S.enemies.filter(e => !e.dead && !e.gone);
  if (S.allyBuff > 0) S.allyBuff -= dt;
  for (let i=S.pulses.length-1;i>=0;i--){            // 퀵정렬 궁극기: 연속 폭격
    const p = S.pulses[i]; p.t -= dt;
    if (p.t <= 0){
      SRC = p.u;
      for (const e of allEnemies()) dmgTo(e, p.base*p.mul, p.col, true);
      FX({k:'wave', x:cv.width/2, y:cv.height/2, r:Math.max(cv.width,cv.height), c:p.col, n:2, life:.6, max:.6});
      SRC = null; S.pulses.splice(i,1);
    }
  }
  for (const u of S.units){
    u.age += dt;
    u.kx *= Math.pow(0.0008, dt); u.ky *= Math.pow(0.0008, dt);   // 반동 감쇠
    const g = U[u.id].ult;
    if (g) u.chgVis = lerp(u.chgVis, Math.min(u.chg, g.need), Math.min(1, dt*6));
    if (g && g.g === 'time') u.chg = Math.min(g.need, u.chg + dt*ultRate());
    if (u.hasteT > 0) u.hasteT -= dt;
    if (S.autoUlt && ultReady(u)) castUlt(u);
    u.cd -= dt;
    if (u.cd <= 0){
      const fired = attack(u);
      u.cd = fired ? U[u.id].cd / (u.hasteT > 0 ? 2 : 1) / (1 + 0.04*S.res.spd) : .1;
      if (!fired) u.ramp = 0;
    }
  }
  for (let i=S.corpses.length-1;i>=0;i--){
    S.corpses[i].t -= dt;
    if (S.corpses[i].t <= 0) S.corpses.splice(i,1);
  }
  for (const f of S.fx) f.life -= dt;
  S.fx = S.fx.filter(f => f.life > 0);
  for (const t of S.texts){ t.life -= dt; t.vy = (t.vy ?? -52) + 105*dt; t.y += t.vy*dt; }
  S.texts = S.texts.filter(t => t.life > 0);
  if (S.phase==='wave' && !S.queue.length && !S.enemies.length) endWave();
}
// 경로를 따라 amount 픽셀만큼 강제 전진
function advanceAlong(e, amount){
  let left = amount;
  while (left > 0){
    const tgt = WP[e.wp];
    if (!tgt) break;
    const tx = px(tgt[0]), ty = px(tgt[1]);
    const dx = tx-e.x, dy = ty-e.y, d = Math.hypot(dx,dy);
    if (d <= left){ e.x = tx; e.y = ty; e.wp++; left -= d; e.dist += d; }
    else { e.x += dx/d*left; e.y += dy/d*left; e.dist += left; left = 0; }
  }
}
function leak(e){
  e.gone = true;
  const b = ENEMY[e.type];
  if (e.type === FINAL_BOSS){            // 최종 보스가 통과하면 그 자리에서 끝입니다
    S.life = 0;
    return gameOver(`${b.n}가 메모리를 통째로 덮어썼습니다`);
  }
  const cost = e.boss ? 10 : 1;          // 중간 보스는 메모리 10
  S.life -= cost;
  log(`${b.n} 침투! 메모리 -${cost}`, !!e.boss);
  if (S.life <= 0){ S.life = 0; gameOver(); }
}

// ═══════════════════════════════ 렌더
function draw(){
  cx.fillStyle='#0b0e17'; cx.fillRect(0,0,cv.width,cv.height);
  cx.strokeStyle='#161d31'; cx.lineWidth=1;
  for (let x=0;x<=COLS;x++){ cx.beginPath(); cx.moveTo(x*TS,0); cx.lineTo(x*TS,ROWS*TS); cx.stroke(); }
  for (let y=0;y<=ROWS;y++){ cx.beginPath(); cx.moveTo(0,y*TS); cx.lineTo(COLS*TS,y*TS); cx.stroke(); }
  cx.fillStyle='#1a2440';
  for (const k of pathSet){ const [x,y]=k.split(',').map(Number); if (y>=0) cx.fillRect(x*TS+1,y*TS+1,TS-2,TS-2); }
  cx.save();                                                 // 진행 방향으로 흐르는 점선
  cx.strokeStyle='#2f3d63'; cx.lineWidth=2;
  cx.setLineDash([6,14]); cx.lineDashOffset=-S.t*26;
  cx.beginPath();
  WP.forEach(([wx,wy],i) => i ? cx.lineTo(px(wx),px(wy)) : cx.moveTo(px(wx),px(wy)));
  cx.stroke(); cx.restore();

  // 드롭 대상 하이라이트
  if (S.drag && S.drag.moved){
    const tx=Math.floor(S.drag.x/TS), ty=Math.floor(S.drag.y/TS);
    if (tx>=0&&tx<COLS&&ty>=0&&ty<ROWS){
      const ok = buildable(tx,ty);
      cx.strokeStyle = ok ? '#7ee787' : '#ff7b72';
      cx.lineWidth=2; cx.setLineDash([5,4]);
      cx.strokeRect(tx*TS+3, ty*TS+3, TS-6, TS-6);
      cx.setLineDash([]);
    }
  }
  for (const u of S.units) if (!(S.drag && S.drag.u===u && S.drag.moved)) drawUnit(u, u.x, u.y);
  drawFX();
  for (const e of S.enemies) drawEnemy(e);
  for (const c of S.corpses){                                   // 사라지는 연출
    const p = 1 - c.t/c.max, s = 1 + p*0.7;
    cx.save(); cx.globalAlpha = (1-easeOut(p)) * .8;
    cx.translate(c.x, c.y); cx.rotate(c.ang * .3 + p*1.2); cx.scale(s, s);
    cx.strokeStyle = c.c; cx.lineWidth = 2;
    cx.beginPath(); cx.arc(0, 0, c.r, 0, 7); cx.stroke();
    for (let i=0;i<5;i++){
      const a = i/5*Math.PI*2, d = c.r*(0.4 + p*1.5);
      cx.beginPath(); cx.moveTo(Math.cos(a)*d, Math.sin(a)*d);
      cx.lineTo(Math.cos(a)*(d+5), Math.sin(a)*(d+5)); cx.stroke();
    }
    cx.restore();
  }
  cx.textAlign='center';
  for (const t of S.texts){
    const p = 1 - t.life/(t.max||.8);
    const s = p < .18 ? easeOutBack(Math.max(0,p)/.18) : 1;   // 팝 하고 나타남
    cx.globalAlpha = Math.min(1, t.life*2.2);
    cx.fillStyle = t.c;
    cx.save(); cx.translate(t.x, t.y); cx.scale(s, s);
    cx.font='bold 12px '+MONO; cx.fillText(t.v, 0, 0); cx.restore();
    cx.globalAlpha=1;
  }
  if (S.drag && S.drag.moved){ cx.globalAlpha=.85; drawUnit(S.drag.u, S.drag.x, S.drag.y); cx.globalAlpha=1; }
}
function drawUnit(u, ux, uy){
  const def=U[u.id], col=TIER[def.t].hex;
  const grow = u.age < .4 ? easeOutBack(u.age/.4) : 1;
  ux += u.kx; uy += u.ky;                                   // 공격 반동
  const x=ux-TS/2, y=uy-TS/2;
  const scaled = grow !== 1;
  if (scaled){ cx.save(); cx.translate(ux, uy); cx.scale(grow, grow); cx.translate(-ux, -uy); }
  if (S.sel===u){
    if (def.rng<90){ cx.globalAlpha=.1; cx.fillStyle=col; cx.beginPath(); cx.arc(ux,uy,def.rng*TS,0,7); cx.fill(); cx.globalAlpha=1; }
    else { cx.globalAlpha=.05; cx.fillStyle=col; cx.fillRect(0,0,cv.width,cv.height); cx.globalAlpha=1; }
    cx.strokeStyle=col; cx.lineWidth=2; cx.strokeRect(x+1,y+1,TS-2,TS-2);
  }
  cx.fillStyle = def.t>=5 ? 'rgba(255,215,110,.15)' : def.t>=4 ? 'rgba(255,123,114,.08)' : 'rgba(255,255,255,.045)';
  cx.fillRect(x+5,y+5,TS-10,TS-10);
  cx.strokeStyle=col; cx.lineWidth=def.t>=4?2:1;
  if (def.t>=5){ cx.setLineDash([4,3]); cx.lineDashOffset=-S.t*14; }
  cx.strokeRect(x+5,y+5,TS-10,TS-10);
  cx.setLineDash([]); cx.lineDashOffset=0;
  cx.fillStyle=col; cx.textAlign='center'; cx.textBaseline='middle';
  cx.font=(def.sym.length>3?'9px ':'13px ')+MONO;
  cx.fillText(def.sym, ux, uy-4);
  cx.fillStyle='#8b98b0'; cx.font='8px '+MONO;
  cx.fillText(def.n.length>6?def.n.slice(0,5)+'…':def.n, ux, uy+13);

  // 편의 표식: ⟳ 합성 가능 / ◆ 신화 재료
  if (MARK.merge.has(u.id)){
    cx.fillStyle='#7ee787'; cx.font='bold 10px '+MONO;
    cx.fillText('⟳', x+11, y+11);
  }
  if (MARK.mat.has(u.id)){
    cx.fillStyle='#ffd76e'; cx.font='bold 9px '+MONO;
    cx.fillText('◆', x+TS-11, y+11);
  }
  const g = U[u.id].ult;
  if (g){                                        // 궁극기 게이지
    const pct = Math.min(1, u.chgVis / g.need), ready = u.chg >= g.need;
    cx.fillStyle = '#0008'; cx.fillRect(x+6, y+TS-9, TS-12, 3.5);
    cx.fillStyle = ready ? '#ffd76e' : '#79c0ff';
    cx.fillRect(x+6, y+TS-9, (TS-12)*pct, 3.5);
    if (ready){                                  // 준비되면 금색 맥동
      cx.strokeStyle = '#ffd76e';
      cx.lineWidth = 1.5 + Math.sin(S.t*7)*0.8;
      cx.globalAlpha = .75 + Math.sin(S.t*7)*.25;
      cx.strokeRect(x+2, y+2, TS-4, TS-4);
      cx.globalAlpha = 1;
    }
  }
  if (u.hasteT > 0){                             // 공속 증가 중
    cx.strokeStyle='#7ee787'; cx.lineWidth=1.5;
    cx.beginPath(); cx.arc(u.x, u.y, TS*.42, S.t*6, S.t*6+1.6); cx.stroke();
  }
  if (u.lock){                                   // 자물쇠 — 합성·판매 보호
    const lx = x+11, ly = y+TS-12;
    cx.strokeStyle='#9fb0cc'; cx.lineWidth=1.4;
    cx.beginPath(); cx.arc(lx, ly-3, 2.8, Math.PI, 0); cx.stroke();
    cx.fillStyle='#9fb0cc'; cx.fillRect(lx-4, ly-2.5, 8, 6);
  }
  if (scaled) cx.restore();
}
function drawEnemy(e){
  const b = ENEMY[e.type], sh = b.shape;
  cx.save();
  const grow = e.age < .35 ? easeOutBack(e.age/.35) : 1;        // 등장할 때 톡 튀어나옴
  if (grow !== 1){ cx.translate(e.x, e.y); cx.scale(grow, grow); cx.translate(-e.x, -e.y); }
  if (e.hidden) cx.globalAlpha = 0.22;                       // 은신 중엔 흐릿하게
  if (b.heal){                                               // 회복 오라 범위
    cx.globalAlpha = .12; cx.fillStyle = e.c;
    cx.beginPath(); cx.arc(e.x, e.y, b.heal.r*TS, 0, 7); cx.fill();
    cx.globalAlpha = .5; cx.strokeStyle = e.c; cx.lineWidth = 1.5; cx.setLineDash([5,5]);
    cx.lineDashOffset = -S.t*12;
    cx.beginPath(); cx.arc(e.x, e.y, b.heal.r*TS, 0, 7); cx.stroke();
    cx.setLineDash([]); cx.globalAlpha = e.hidden ? .22 : 1;
  }
  if (b.armorAura){                                          // 장갑 오라 범위
    cx.globalAlpha = .3; cx.strokeStyle = '#c0a0ff'; cx.lineWidth = 2; cx.setLineDash([2,6]);
    cx.beginPath(); cx.arc(e.x, e.y, b.armorAura.r*TS, 0, 7); cx.stroke();
    cx.setLineDash([]); cx.globalAlpha = e.hidden ? .22 : 1;
  }
  if (e.auraArmor){                                          // 장갑을 받은 상태
    cx.strokeStyle='#c0a0ff'; cx.lineWidth=1.5; cx.globalAlpha=(e.hidden?.22:1)*.8;
    cx.beginPath(); cx.arc(e.x, e.y, e.r+5, 0.6, 2.2); cx.stroke();
    cx.globalAlpha = e.hidden ? .22 : 1;
  }
  if (b.haste){                                              // 가속 오라 범위
    cx.globalAlpha = .35; cx.strokeStyle = '#ffd76e'; cx.lineWidth = 2; cx.setLineDash([3,7]);
    cx.lineDashOffset = S.t*20;
    cx.beginPath(); cx.arc(e.x, e.y, b.haste.r*TS, 0, 7); cx.stroke();
    cx.setLineDash([]); cx.globalAlpha = e.hidden ? .22 : 1;
  }
  const wob = Math.sin(e.bob) * (sh==='circle' ? .07 : .05);    // 살아있는 느낌의 미세한 맥동
  cx.save();
  cx.translate(e.x, e.y);
  if (sh==='tri') cx.rotate(e.ang + Math.PI/2);                 // 진행 방향을 봄
  else if (sh==='diamond') cx.rotate(e.ang * .35 + S.t*.4);
  else if (sh==='square') cx.rotate(Math.sin(S.t*1.6 + e.bob*.1) * .12);
  cx.scale(1+wob, 1-wob);
  cx.fillStyle=e.c; cx.beginPath();
  const R=e.r;
  if (sh==='circle') cx.arc(0,0,R,0,7);
  else if (sh==='tri'){ cx.moveTo(0,-R); cx.lineTo(R,R*.8); cx.lineTo(-R,R*.8); cx.closePath(); }
  else if (sh==='diamond'){ cx.moveTo(0,-R); cx.lineTo(R,0); cx.lineTo(0,R); cx.lineTo(-R,0); cx.closePath(); }
  else if (sh==='square') cx.rect(-R,-R,R*2,R*2);
  else { for (let i=0;i<6;i++){ const a=i/6*Math.PI*2+S.t*.6; const fx=Math.cos(a)*R, fy=Math.sin(a)*R; i?cx.lineTo(fx,fy):cx.moveTo(fx,fy); } cx.closePath(); }
  cx.fill();
  if (e.flash > 0){                                             // 피격 섬광
    cx.globalAlpha = (e.flash/0.14) * 0.75;
    cx.fillStyle = '#fff'; cx.fill();
    cx.globalAlpha = e.hidden ? .22 : 1;
  }
  cx.restore();
  if (b.armor){                                              // 장갑 — 겹겹의 판
    cx.strokeStyle='#e8eefc'; cx.globalAlpha=(e.hidden?.22:1)*.55; cx.lineWidth=2;
    cx.beginPath(); cx.arc(e.x,e.y,e.r-3,0,7); cx.stroke();
    cx.globalAlpha=(e.hidden?.22:1)*.3;
    cx.beginPath(); cx.arc(e.x,e.y,e.r-6,0,7); cx.stroke();
    cx.globalAlpha=e.hidden?.22:1;
  }
  if (e.enraged){                                            // 폭주 — 붉은 아우라
    cx.strokeStyle='#ff5b52'; cx.lineWidth=2.5;
    cx.beginPath(); cx.arc(e.x,e.y,e.r+5+Math.sin(S.t*9)*2,0,7); cx.stroke();
  }
  if (b.regen){
    cx.strokeStyle='#fff6'; cx.lineWidth=2;
    cx.beginPath(); cx.arc(e.x,e.y,e.r+4, S.t*3, S.t*3+2.2); cx.stroke();
  }
  if (e.healAura){                                           // 회복받는 중
    cx.strokeStyle='#8ce8c8'; cx.lineWidth=1.5;
    cx.beginPath(); cx.arc(e.x,e.y,e.r+6,-1.2,0.4); cx.stroke();
  }
  if (e.slow>0){ cx.strokeStyle='#ffd76e'; cx.lineWidth=1.5; cx.beginPath(); cx.arc(e.x,e.y,e.r+3,0,7); cx.stroke(); }
  if (e.shield > 0){                                         // 보호막 — 육각 실드
    cx.strokeStyle='#8ab4ff'; cx.lineWidth=2; cx.globalAlpha=(e.hidden?.22:1)*.85;
    cx.beginPath();
    for (let i=0;i<6;i++){ const a=i/6*Math.PI*2 - S.t*.5, rr=e.r+6;
      const fx=e.x+Math.cos(a)*rr, fy=e.y+Math.sin(a)*rr; i?cx.lineTo(fx,fy):cx.moveTo(fx,fy); }
    cx.closePath(); cx.stroke(); cx.globalAlpha=e.hidden?.22:1;
  }
  const w=e.r*2.3, ratio=Math.max(0,e.hp/e.max), ghost=Math.max(0,e.hpGhost/e.max);
  cx.fillStyle='#000a'; cx.fillRect(e.x-w/2, e.y-e.r-9, w, 4);
  if (ghost > ratio){                                           // 깎인 만큼 붉은 잔상이 따라옴
    cx.fillStyle='#ff5b5240'; cx.fillRect(e.x-w/2, e.y-e.r-9, w*ghost, 4);
  }
  cx.fillStyle = ratio>.5?'#7ee787':ratio>.22?'#f2cc60':'#ff7b72';
  cx.fillRect(e.x-w/2, e.y-e.r-9, w*ratio, 4);
  if (e.shieldMax > 0){                                      // 보호막 게이지
    cx.fillStyle='#000a'; cx.fillRect(e.x-w/2, e.y-e.r-14, w, 3);
    cx.fillStyle='#8ab4ff'; cx.fillRect(e.x-w/2, e.y-e.r-14, w*Math.max(0,e.shield/e.shieldMax), 3);
  }
  cx.restore();
}
function drawFX(){
  cx.textAlign='center'; cx.textBaseline='middle'; cx.lineCap='round';
  for (const f of S.fx){
    const raw = 1 - f.life/f.max;
    const p = easeOut(raw);                                  // 퍼짐은 빠르게 시작해 느리게
    const a = Math.min(1, Math.pow(f.life/f.max, .65)*1.5);  // 사라짐은 늦게
    cx.globalAlpha = a; cx.strokeStyle = f.c; cx.fillStyle = f.c; cx.lineWidth = f.w||2;
    switch (f.k){
      case 'beam':
        if (f.dash) cx.setLineDash(f.dash);
        cx.beginPath(); cx.moveTo(f.x1,f.y1); cx.lineTo(f.x2,f.y2); cx.stroke(); cx.setLineDash([]);
        break;
      case 'jitter': {
        cx.setLineDash([4,3]); cx.beginPath(); cx.moveTo(f.x1,f.y1);
        const steps=6;
        for (let i=1;i<=steps;i++){
          const t=i/steps;
          cx.lineTo(f.x1+(f.x2-f.x1)*t + (i<steps?(Math.random()-.5)*7:0),
                    f.y1+(f.y2-f.y1)*t + (i<steps?(Math.random()-.5)*7:0));
        }
        cx.stroke(); cx.setLineDash([]); break;
      }
      case 'bullet': {
        const x=f.x1+(f.x2-f.x1)*p, y=f.y1+(f.y2-f.y1)*p;
        cx.font='bold '+f.sz+'px '+MONO; cx.fillText(f.txt, x, y);
        break;
      }
      case 'label': cx.font='bold 11px '+MONO; cx.fillText(f.txt, f.x, f.y - p*12); break;
      case 'box': {
        cx.font='bold 10px '+MONO;
        const w=f.txt.length*7+6;
        cx.globalAlpha=a*.25; cx.fillRect(f.x-w/2, f.y-8, w, 15);
        cx.globalAlpha=a; cx.strokeRect(f.x-w/2, f.y-8, w, 15);
        cx.fillText(f.txt, f.x, f.y); break;
      }
      case 'pop':
        cx.lineWidth=2.5*(1-p)+.5; cx.beginPath(); cx.arc(f.x,f.y, 5+p*26, 0, 7); cx.stroke(); break;
      case 'wave':
        for (let i=0;i<(f.n||1);i++){
          const t = p - i*0.18; if (t<0) continue;
          cx.globalAlpha = a*(1-t)*.9; cx.lineWidth=2;
          const r = t*f.r;
          cx.beginPath();
          if (f.square) cx.rect(f.x-r, f.y-r, r*2, r*2); else cx.arc(f.x,f.y,r,0,7);
          cx.stroke();
        }
        break;
      case 'branch': {
        const mx=(f.x1+f.x2)/2, my=(f.y1+f.y2)/2, s=9;
        cx.beginPath(); cx.moveTo(f.x1,f.y1); cx.lineTo(mx,my); cx.stroke();
        cx.beginPath();
        cx.moveTo(mx,my-s); cx.lineTo(mx+s,my); cx.lineTo(mx,my+s); cx.lineTo(mx-s,my); cx.closePath();
        cx.globalAlpha=a*.3; cx.fill(); cx.globalAlpha=a; cx.stroke();
        cx.beginPath(); cx.moveTo(mx,my); cx.lineTo(f.x2,f.y2);
        cx.lineWidth = f.hit?4:1.5; cx.stroke();
        cx.font='bold 9px '+MONO; cx.fillText(f.hit?'true':'false', mx, my-16);
        break;
      }
      case 'orbit': {
        const turns=f.turns;
        for (let i=0;i<turns;i++){
          const st = p*turns*Math.PI*2 + i*Math.PI/2;
          cx.beginPath(); cx.arc(f.x, f.y, f.r, st, st+1.0); cx.stroke();
        }
        cx.font='bold 9px '+MONO; cx.fillText('i='+Math.min(turns-1,(p*turns)|0), f.x, f.y-f.r-10);
        break;
      }
      case 'stack': {
        const n=3;
        for (let i=0;i<n;i++){
          const off = (i===n-1) ? p*26 : 0;
          const yy = f.y-34+i*11+off;
          cx.globalAlpha = a*(i===n-1?1:.55);
          cx.strokeRect(f.x-13, yy, 26, 9);
        }
        cx.globalAlpha=a; cx.font='bold 9px '+MONO; cx.fillText('pop', f.x, f.y-46);
        break;
      }
      case 'queue': {
        const dx=f.x2-f.x1, dy=f.y2-f.y1, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len;
        for (let i=0;i<4;i++){
          const t=((p+i*.25)%1)*len;
          const hx=f.x1+ux*t, hy=f.y1+uy*t;
          cx.beginPath();
          cx.moveTo(hx-ux*7-uy*4, hy-uy*7+ux*4);
          cx.lineTo(hx, hy);
          cx.lineTo(hx-ux*7+uy*4, hy-uy*7-ux*4);
          cx.stroke();
        }
        break;
      }
      case 'nodes': {
        for (let i=0;i<f.pts.length-1;i++){
          const [x1,y1]=f.pts[i], [x2,y2]=f.pts[i+1];
          cx.beginPath(); cx.moveTo(x1,y1); cx.lineTo(x2,y2); cx.stroke();
          const mx=(x1+x2)/2, my=(y1+y2)/2, ang=Math.atan2(y2-y1,x2-x1);
          cx.beginPath();
          cx.moveTo(mx,my);
          cx.lineTo(mx-Math.cos(ang-.4)*7, my-Math.sin(ang-.4)*7);
          cx.moveTo(mx,my);
          cx.lineTo(mx-Math.cos(ang+.4)*7, my-Math.sin(ang+.4)*7);
          cx.stroke();
          if (i>0){ cx.beginPath(); cx.arc(x1,y1,5,0,7); cx.stroke(); }
        }
        break;
      }
      case 'bucket': {
        cx.globalAlpha=a*.25; cx.fillRect(f.x-22, f.y-30, 44, 17);
        cx.globalAlpha=a; cx.strokeRect(f.x-22, f.y-30, 44, 17);
        cx.font='bold 9px '+MONO; cx.fillText('{k:v}', f.x, f.y-21);
        cx.beginPath(); cx.arc(f.x, f.y, 6+p*16, 0, 7); cx.stroke();
        break;
      }
      case 'tree': {
        const mx=f.x, my=f.y+18;
        cx.beginPath(); cx.moveTo(f.x,f.y); cx.lineTo(mx,my); cx.stroke();
        for (const [tx,ty] of f.pts){
          cx.beginPath(); cx.moveTo(mx,my);
          cx.lineTo(mx+(tx-mx)*.5, my+(ty-my)*.5);
          cx.lineTo(tx,ty); cx.stroke();
          cx.beginPath(); cx.arc(tx,ty,4,0,7); cx.stroke();
        }
        break;
      }
      case 'graph': {
        const grow = Math.min(1, p*2.2);
        // 1) 영향권을 채워 범위를 명확히
        cx.globalAlpha = a*.22;
        cx.beginPath(); cx.arc(f.cx, f.cy, f.r*grow, 0, 7); cx.fill();
        // 2) 바깥으로 퍼지는 충격파 두 겹
        for (let k=0;k<2;k++){
          const t = p*1.5 - k*.22; if (t<0 || t>1) continue;
          cx.globalAlpha = a*(1-t)*.9; cx.lineWidth = 3.5-k;
          cx.beginPath(); cx.arc(f.cx, f.cy, f.r*(.35+t*.85), 0, 7); cx.stroke();
        }
        // 3) 고정 테두리 — 사거리를 계속 보여줌
        cx.globalAlpha = a*.9; cx.lineWidth = 2.5; cx.setLineDash([7,5]); cx.lineDashOffset = -p*40;
        cx.beginPath(); cx.arc(f.cx, f.cy, f.r, 0, 7); cx.stroke(); cx.setLineDash([]);
        // 4) 유닛 → 폭심 간선
        cx.globalAlpha = a; cx.lineWidth = 3.5;
        cx.beginPath(); cx.moveTo(f.ux, f.uy); cx.lineTo(f.cx, f.cy); cx.stroke();
        // 5) 정점 완전 연결 그래프
        cx.lineWidth = 2.4;
        for (let i=0;i<f.pts.length;i++)
          for (let j=i+1;j<f.pts.length;j++){
            cx.globalAlpha = a*.8;
            cx.beginPath(); cx.moveTo(f.pts[i][0],f.pts[i][1]); cx.lineTo(f.pts[j][0],f.pts[j][1]); cx.stroke();
          }
        // 6) 정점 — 흰 심지를 넣어 어두운 배경에서도 튀게
        for (const [vx,vy] of f.pts){
          cx.globalAlpha = a*.6; cx.beginPath(); cx.arc(vx,vy,6,0,7); cx.fill();
          cx.globalAlpha = a; cx.fillStyle = '#fff';
          cx.beginPath(); cx.arc(vx,vy,2.2,0,7); cx.fill();
          cx.fillStyle = f.c; cx.lineWidth = 2.4;
          cx.beginPath(); cx.arc(vx,vy, 9+p*6, 0, 7); cx.stroke();
        }
        cx.globalAlpha = a; cx.font = 'bold 10px '+MONO;
        cx.fillText('adj[ ]', f.cx, f.cy - f.r - 8);
        break;
      }
      case 'drop': {
        const y = f.y - 130*(1-p), s = 13;
        cx.beginPath(); cx.moveTo(f.x, y+s); cx.lineTo(f.x-s, y-s); cx.lineTo(f.x+s, y-s); cx.closePath();
        cx.globalAlpha=a*.35; cx.fill(); cx.globalAlpha=a; cx.stroke();
        break;
      }
      case 'rings': {
        for (let i=0;i<f.n;i++){
          const t=p*1.4 - i*.12; if (t<0||t>1) continue;
          cx.globalAlpha=a*(1-t*.5); cx.lineWidth=1.5;
          cx.beginPath(); cx.arc(f.x,f.y, f.r*(1-t), 0, 7); cx.stroke();
        }
        cx.globalAlpha=a; cx.font='bold 9px '+MONO;
        cx.fillText('f(n-'+Math.min(5,(p*6)|0)+')', f.x, f.y-f.r-8);
        break;
      }
      case 'shatter': {
        for (let i=0;i<8;i++){
          const ang=i/8*Math.PI*2, d=p*30;
          cx.beginPath();
          cx.moveTo(f.x+Math.cos(ang)*d, f.y+Math.sin(ang)*d);
          cx.lineTo(f.x+Math.cos(ang)*(d+9), f.y+Math.sin(ang)*(d+9));
          cx.stroke();
        }
        break;
      }
      case 'cache': case 'table': {
        const cells = f.k==='cache'?6:8, w=13;
        const x0 = f.x - cells*w/2;
        for (let i=0;i<cells;i++){
          cx.globalAlpha = a*(i<f.fill?1:.25);
          if (i<f.fill){ cx.fillRect(x0+i*w+1, f.y+1, w-2, 11); }
          else cx.strokeRect(x0+i*w+1, f.y+1, w-2, 11);
        }
        cx.globalAlpha=a; cx.font='bold 9px '+MONO;
        cx.fillText(f.k==='cache'?'cache':'dp[]', f.x, f.y-8);
        break;
      }
      case 'bits': {
        cx.font='bold 10px '+MONO;
        for (let i=0;i<14;i++){
          const ang = i/14*Math.PI*2 + f.x*0.01;
          const d = f.r*(0.25+((i*37)%100)/140);
          cx.globalAlpha = a*.9;
          cx.fillText((i*13)%2 ? '1':'0', f.x+Math.cos(ang)*d, f.y+Math.sin(ang)*d);
        }
        cx.globalAlpha=a; cx.lineWidth=2;
        cx.beginPath(); cx.arc(f.x,f.y, f.r*p, 0, 7); cx.stroke();
        break;
      }
      case 'pivot': {
        cx.lineWidth=2;
        cx.beginPath(); cx.moveTo(f.x, f.y-f.r); cx.lineTo(f.x, f.y+f.r); cx.stroke();
        cx.font='bold 9px '+MONO; cx.fillText('pivot', f.x, f.y-f.r-9);
        for (let i=0;i<5;i++){
          const h=(i+1)*7, side=i<2?-1:1, off=(20+i*13)*p*side;
          cx.globalAlpha=a*.8;
          cx.fillRect(f.x+off-3, f.y-h/2, 6, h);
        }
        cx.globalAlpha=a; cx.lineWidth=1.5;
        cx.beginPath(); cx.arc(f.x,f.y,f.r*p,0,7); cx.stroke();
        break;
      }
      case 'trail': {
        cx.lineWidth=3; cx.beginPath();
        const total=f.pts.length-1, upto=Math.max(1, Math.ceil(total*Math.min(1,p*1.5)));
        cx.moveTo(f.pts[0][0], f.pts[0][1]);
        for (let i=1;i<=upto && i<f.pts.length;i++) cx.lineTo(f.pts[i][0], f.pts[i][1]);
        cx.stroke();
        for (let i=1;i<=upto && i<f.pts.length;i++){
          cx.beginPath(); cx.arc(f.pts[i][0], f.pts[i][1], 5, 0, 7); cx.stroke();
        }
        break;
      }
      case 'route': {
        cx.setLineDash([7,5]); cx.lineDashOffset = -p*40; cx.lineWidth=3;
        cx.beginPath(); cx.moveTo(f.x1,f.y1); cx.lineTo(f.x2,f.y2); cx.stroke();
        cx.setLineDash([]); cx.lineDashOffset=0;
        cx.lineWidth=2; cx.beginPath(); cx.arc(f.x2,f.y2, 10+p*26, 0, 7); cx.stroke();
        break;
      }
      case 'bracket': {
        const d = 60*(1-p)+8, h=13;
        cx.lineWidth=2;
        cx.beginPath();
        cx.moveTo(f.x-d+7, f.y-h); cx.lineTo(f.x-d, f.y-h); cx.lineTo(f.x-d, f.y+h); cx.lineTo(f.x-d+7, f.y+h);
        cx.stroke();
        cx.beginPath();
        cx.moveTo(f.x+d-7, f.y-h); cx.lineTo(f.x+d, f.y-h); cx.lineTo(f.x+d, f.y+h); cx.lineTo(f.x+d-7, f.y+h);
        cx.stroke();
        cx.font='bold 9px '+MONO; cx.fillText('mid', f.x, f.y-h-8);
        break;
      }
    }
    cx.globalAlpha=1; cx.setLineDash([]);
  }
}

// ═══════════════════════════════ 입력 (드래그 이동)
function pos(ev){
  const r = cv.getBoundingClientRect();
  return { x:(ev.clientX-r.left)*(cv.width/r.width), y:(ev.clientY-r.top)*(cv.height/r.height) };
}
cv.addEventListener('pointerdown', ev => {
  ev.preventDefault();
  const p = pos(ev), tx = Math.floor(p.x/TS), ty = Math.floor(p.y/TS);
  const u = S.units.find(o => o.tx===tx && o.ty===ty);
  if (u !== S.sel) S.sellArm = null;
  if (!u){ S.sel = null; sync(); return; }
  S.drag = {u, x:p.x, y:p.y, sx:p.x, sy:p.y, moved:false};
  cv.setPointerCapture(ev.pointerId);
  cv.classList.add('grabbing');
});
cv.addEventListener('pointermove', ev => {
  if (!S.drag) return;
  const p = pos(ev);
  S.drag.x = p.x; S.drag.y = p.y;
  if (Math.hypot(p.x-S.drag.sx, p.y-S.drag.sy) > 8) S.drag.moved = true;
});
function endDrag(){
  const d = S.drag; if (!d) return;
  S.drag = null; cv.classList.remove('grabbing');
  const u = d.u;
  if (!d.moved){ S.sel = u; sync(); return; }
  const tx = Math.floor(d.x/TS), ty = Math.floor(d.y/TS);
  if (!buildable(tx,ty)){ S.sel = u; sync(); return; }
  const other = S.units.find(o => o.tx===tx && o.ty===ty);
  if (other && other !== u){
    const ox=u.tx, oy=u.ty;
    u.tx=tx; u.ty=ty; u.x=px(tx); u.y=px(ty);
    other.tx=ox; other.ty=oy; other.x=px(ox); other.y=px(oy);
  } else if (!other){
    u.tx=tx; u.ty=ty; u.x=px(tx); u.y=px(ty);
  }
  u.ramp = 0; u.last = null;
  S.sel = u; sync();
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

// ═══════════════════════════════ UI (앱 셸)
const SHEET = { kind:null };
const isDesk = () => matchMedia('(min-width:1000px)').matches;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// 알림은 맵을 가리지 않고 하단 스트립에서 잠깐 지나갑니다.
let flashUntil = 0, flashTimer = null;
function toast(msg, hi){
  const s = $('ustrip');
  flashUntil = performance.now() + 2200;
  s.className = 'ustrip flash' + (hi ? ' hi' : '');
  s.innerHTML = `<span class="fm">${esc(msg)}</span>`;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { flashUntil = 0; renderStrip(); }, 2200);
}

// ── 바텀 시트
function openSheet(kind, title){
  SHEET.kind = kind;
  $('sheet-title').textContent = title;
  $('sheet').classList.add('open');
  $('scrim').classList.add('open');
  renderSheet();
}
function closeSheet(){
  if (isDesk()){ openSheet('unit', '유닛 정보'); return; }   // PC에선 패널이 늘 떠 있습니다
  SHEET.kind = null;
  $('sheet').classList.remove('open');
  $('scrim').classList.remove('open');
}
function renderSheet(){
  const b = $('sheet-body');
  switch (SHEET.kind){
    case 'unit':  b.innerHTML = htmlUnit(); bindUnit(b); break;
    case 'craft': b.innerHTML = htmlCraft(); bindCraft(b); break;
    case 'gacha': b.innerHTML = htmlGacha(); bindGacha(b); break;
    case 'log':   b.innerHTML = htmlLog(); break;
    case 'dex':   b.innerHTML = htmlDex(); break;
    case 'menu':  b.innerHTML = htmlMenu(); bindMenu(b); break;
    case 'wave':  b.innerHTML = htmlWave(); break;
    case 'lab':   b.innerHTML = htmlLab(); bindLab(b); break;
  }
}

// ── 유닛 상세
function htmlUnit(){
  const u = selUnit();
  if (!u) return '<p class="empty">보드의 유닛을 눌러 선택하세요. 끌어서 옮길 수 있고, 다른 유닛 위에 놓으면 자리가 바뀝니다.</p>';
  const d = U[u.id], t = TIER[d.t], armed = S.sellArm === u;
  return `
    <div class="u-head"><p class="u-name" style="color:${t.hex}">${esc(d.n)}</p>
      <span class="tag" style="color:${t.hex}">${t.n} · ${t.label}</span></div>
    <div class="u-stats">
      <div>공격력<b>${d.dmg === 0 ? '지원' : d.dmg}</b></div>
      <div>사거리<b>${d.rng >= 90 ? '전체' : d.rng.toFixed(1)}</b></div>
      <div>공속<b>${d.sp.t === 'buff' ? '—' : d.cd.toFixed(2)+'s'}</b></div>
      <div>보유<b>${S.units.filter(x => x.id === u.id).length}</b></div>
    </div>
    <p class="u-desc">${esc(d.d)}</p>
    ${d.sk ? `<div class="abil sk"><div class="ab-h"><b>스킬</b><span>${esc(d.sk.n)}</span>
       <i>${Math.round(d.sk.p*100)}%</i></div><p>${esc(d.sk.d)}</p></div>` : ''}
    ${d.ult ? `<div class="abil ult"><div class="ab-h"><b>궁극기</b><span>${esc(d.ult.n)}</span>
       <i>${({dmg:'피해 누적', time:'시간 경과', hit:'공격 횟수', kill:'처치 수'})[d.ult.g]}</i></div>
       <p>${esc(d.ult.d)}</p>
       <div class="ab-g"><div style="width:${Math.min(100, u.chg/d.ult.need*100)}%"></div></div>
       <div class="ab-n">${Math.floor(Math.min(u.chg, d.ult.need)).toLocaleString()} / ${d.ult.need.toLocaleString()}</div>
       ${u.chg >= d.ult.need ? '<div class="ab-rdy">충전 완료 — 곧 자동 발동됩니다</div>' : ''}</div>` : ''}
    <p class="u-vfx"><b>연출</b> · ${esc(d.v)}</p>
    <pre class="u-code">${esc(d.c)}</pre>
    ${matWarn(u) ? '<p class="warn">◆ 이 유닛은 신화 조합 재료로 잡혀 있습니다.</p>' : ''}
    <button class="full ${u.lock?'on':''}" data-act="lock">${u.lock ? '잠금 해제' : '잠그기'}<small>${u.lock ? '합성·판매에서 보호 중' : '자동합성과 판매에서 제외합니다'}</small></button>
    <button class="danger full" data-act="sell" ${u.lock?'disabled':''}>${armed ? '한 번 더 눌러 판매' : '판매 · +'+SELL[d.t]+'G'}</button>`;
}
function bindUnit(b){
  const lk = b.querySelector('[data-act=lock]');
  if (lk) lk.onclick = () => { const u = selUnit(); if (u){ u.lock = !u.lock; sync(); renderSheet(); } };
  const s = b.querySelector('[data-act=sell]');
  if (s) s.onclick = () => { sellSelected(); if (!selUnit()) closeSheet(); else renderSheet(); };
}
const selUnit = () => (S.sel && S.units.includes(S.sel)) ? S.sel : null;

// ── 조합
function htmlCraft(){
  const st = recipeStatus().map((s,i) => ({...s, i}))
    .sort((a,b) => a.miss.length - b.miss.length);
  const c = held();
  let h = `<div class="autobar"><span>같은 유닛 3개를 자동으로 합칩니다<br>(일반·고급 등급만)</span>
    <button class="${S.auto?'on':''}" data-act="auto">${S.auto?'ON':'OFF'}</button></div>`;
  st.forEach(s => {
    const parts = Object.keys(s.need).map(k =>
      `<span class="${(c[k]||0)>=s.need[k]?'ok':''}">${U[k].n} ${c[k]||0}/${s.need[k]}</span>`).join(' + ');
    const hint = s.ok ? '<span class="ready">재료 완성</span>'
      : `<span class="short">${s.miss.map(k=>U[k].n).join(', ')} 필요</span>`;
    h += `<div class="recipe ${s.ok?'can':''}"><div class="rl">
      <div class="rname">${esc(U[s.r.id].n)} ${s.ok?'◆':''}</div>
      <div class="need">${parts}</div><div class="need">${hint}</div></div>
      <button data-craft="${s.i}" ${s.ok?'class="go"':'disabled'}>${s.ok?'제작':'부족'}</button></div>`;
  });
  return h;
}
function bindCraft(b){
  b.querySelector('[data-act=auto]').onclick = () => {
    S.auto = !S.auto;
    if (S.auto) autoMerge();
    sync(); renderSheet();
  };
  b.querySelectorAll('[data-craft]').forEach(el => {
    el.onclick = () => { craft(+el.dataset.craft); renderSheet(); };
  });
}

// ── 소환소
SHEET.gtab = 'draft';
function held(){
  const c = {};
  for (const u of S.units) c[u.id] = (c[u.id]||0)+1;
  return c;
}
// 재료가 1개만 모자란 신화를 찾아냅니다.
function recipeStatus(){
  const c = held();
  return RECIPES.map(r => {
    const need = {};
    for (const n of r.need) need[n] = (need[n]||0)+1;
    const miss = [];
    for (const k in need) for (let i=(c[k]||0); i<need[k]; i++) miss.push(k);
    return {r, need, miss, ok: miss.length === 0};
  });
}
