function htmlWave(){
  const w = S.wave + (S.phase === 'wave' ? 0 : 1);
  if (w > S.maxWave) return '<p class="empty">마지막 웨이브까지 끝났습니다.</p>';
  const q = (S.phase === 'wave') ? S.queue.slice() : buildWave(w);
  if (!q.length) return '<p class="empty">남은 적이 없습니다.</p>';
  const m = {};
  for (const it of q){
    m[it.type] = m[it.type] || {n:0, hp:0};
    m[it.type].n++;
    m[it.type].hp = Math.round(ENEMY[it.type].hp * it.hpMul);
  }
  const total = Object.values(m).reduce((s,v) => s + v.n*v.hp, 0);
  let h = `<p class="gnote" style="margin:0 0 10px">WAVE ${w} · 남은 적 ${q.length}마리 ·
    총 체력 ${total.toLocaleString()}</p>`;
  for (const [k,v] of Object.entries(m).sort((a,b) => b[1].hp - a[1].hp)){
    const e = ENEMY[k];
    h += `<div class="recipe"><div class="rl">
      <div class="rname" style="color:${e.c}">${e.n}${e.boss?' · 보스':''}</div>
      <div class="need">체력 ${v.hp.toLocaleString()} · 속도 ${e.sp}
      ${e.ab?'<br>'+esc(e.ab):''}${e.boss ? (k==='ovf' ? '<br><b style="color:#ff7b72">통과하면 즉시 패배</b>' : '<br>뚫리면 메모리 10 손실') : ''}</div></div>
      <button disabled>${v.n}마리</button></div>`;
  }
  return h;
}

let lastSig = '';
let lastLife = 20;
function sync(){
  $('s-gold').textContent = Math.floor(S.gold);
  $('s-life').textContent = S.life;
  if (S.life < lastLife){
    const chip = $('s-life').parentElement;
    chip.classList.add('hurt');
    setTimeout(() => chip.classList.remove('hurt'), 420);
  }
  lastLife = S.life;
  $('s-wave').textContent = S.wave ? (stageOf(S.wave)+1) + '-' + stageWave(S.wave) : '0-0';
  $('s-unit').textContent = S.units.length + '/' + S.cap;
  $('s-next').textContent = S.phase === 'wave' ? (S.enemies.length + S.queue.length) + '마리'
    : S.phase === 'prep' ? S.prep.toFixed(1) + 's' : '대기';
  $('btn-skip').classList.toggle('hide', S.phase !== 'prep' || S.paused);
  $('btn-resume').classList.toggle('hide', !S.paused);

  // 골드 액수 대신 '상태가 실제로 바뀌었는가'만 봅니다 (깜빡임 방지)
  const sig = [S.units.map(u=>u.id).join(','), S.sel ? S.units.indexOf(S.sel) : -1,
               S.sellArm ? 1 : 0, S.over ? 1 : 0, S.auto ? 1 : 0,
               S.gold >= 100 ? 1 : 0, mergeGroups(3).length,
               ticketTotal(), ticketAlerts().length, S.draft ? 1 : 0,
               SHEET.kind === 'lab' ? Math.floor(S.gold/250) : 0].join('|');
  if (sig !== lastSig){ lastSig = sig; heavySync(); }
}

function heavySync(){
  const u = selUnit();
  $('btn-summon').disabled = S.gold < 100 || S.over;
  $('btn-gacha').disabled = S.over;
  $('btn-gacha').classList.toggle('go', !!S.draft);
  const tkAll = ticketTotal(), alerts = ticketAlerts();
  const gb = $('btn-gacha');
  gb.classList.toggle('go', !!S.draft || tkAll > 0);
  $('gacha-sub').textContent = S.draft ? '◆ 3택 대기중' : tkAll ? `소환권 ${tkAll}장` : '소환권 없음';
  const dot = $('gacha-dot');
  const show = !!S.draft || alerts.length > 0;
  const txt = S.draft ? '!' : String(alerts.length);
  if (show){
    if (dot.classList.contains('hide')){        // 숨김 → 표시로 바뀔 때만 튀어나옵니다
      dot.classList.remove('hide', 'pop');
      void dot.offsetWidth;
      dot.classList.add('pop');
    }
    if (dot.textContent !== txt) dot.textContent = txt;
  } else dot.classList.add('hide');
  const g = mergeGroups(3);
  $('btn-merge').disabled = !g.length || S.over;
  $('btn-merge').innerHTML = '합성<small>' + (g.length ? g.length + '조합 가능' : '3개 필요') + '</small>';
  $('btn-lab').disabled = S.over;
  $('btn-lab').classList.toggle('go', RESEARCH.some(r => S.res[r.k] < r.max && S.gold >= resCost(r)));
  const sb = $('btn-sell');
  sb.disabled = !u || S.over;
  sb.innerHTML = u ? (S.sellArm === u ? '한 번 더<small>정말 판매</small>' : '판매<small>+'+SELL[U[u.id].t]+'G</small>')
                   : '판매<small>유닛 선택</small>';

  renderStrip();
  if (['unit','craft','gacha','lab'].includes(SHEET.kind)) queueSheetRender();
  refreshMarks();
}

// 보드 표식과 신화 완성 알림
let lastReady = '';
function matWarn(u){
  return recipeStatus().some(s => s.miss.length <= 1 && s.r.need.includes(u.id));
}
function refreshMarks(){
  const st = recipeStatus(), c = held();
  MARK.merge.clear(); MARK.mat.clear();
  for (const id in c) if (c[id] >= 3 && U[id].t <= 3) MARK.merge.add(id);
  for (const s of st){
    if (s.miss.length > 1) continue;              // 하나만 더 모으면 되는 조합의 재료만 표시
    for (const k of s.r.need) if (c[k]) MARK.mat.add(k);
  }
  const ready = st.filter(s => s.ok).map(s => s.r.id);
  const cb = $('btn-craft');
  cb.classList.toggle('go', ready.length > 0);
  cb.innerHTML = ready.length
    ? '조합<small>◆ ' + ready.length + '개 제작 가능</small>'
    : '조합<small>신화 제작</small>';
  const key = ready.join(',');
  if (key && key !== lastReady){
    const fresh = ready.filter(id => !lastReady.split(',').includes(id));
    if (fresh.length) log('◆ ' + fresh.map(id => U[id].n).join(', ') + ' 제작 가능!', true);
  }
  lastReady = key;
}

function renderStrip(){
  if (performance.now() < flashUntil) return;   // 알림이 떠 있는 동안은 유지

  }
}

function bindTitle(){
  $('t-start').onclick = () => {
    const t = $('title');
    t.classList.add('out');                       // 타이틀이 흐려지며 물러남
    $('banner').classList.add('hide');
    setTimeout(() => {
      t.classList.add('hide'); t.classList.remove('out');
      const boot = document.createElement('div');  // 컴파일 문구가 한 번 스쳐감
      boot.id = 'boot'; boot.textContent = '> compiling defenses...';
      $('board').appendChild(boot);
      setTimeout(() => boot.remove(), 1000);
      ['board','hud','ustrip','controls'].forEach(sel => {
        const el = sel === 'board' ? $('board') : document.querySelector('.'+sel);
        if (el){ el.classList.add('boot'); setTimeout(() => el.classList.remove('boot'), 1000); }
      });
      startWave();
    }, 400);
  };
  $('t-dex').onclick = () => titleSub('유닛 도감', htmlDex());
  $('t-how').onclick = () => titleSub('플레이 방법', HOW_HTML);
}
